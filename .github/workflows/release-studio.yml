name: Phát hành EldenEffect

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Đóng gói bản cập nhật
        run: node .github/scripts/build-studio-update.mjs "$GITHUB_SHA" "$GITHUB_REF_NAME" "$RUNNER_TEMP/eldeneffect-update.zip"

      - name: Đăng GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/eldeneffect-update.zip" \
            --verify-tag --generate-notes --latest
