<svg xmlns="http://www.w3.org/2000/svg" width="160" height="180" viewBox="0 0 160 180">
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#dropShadow)">
    <!-- Tai thỏ trái -->
    <ellipse cx="60" cy="45" rx="14" ry="40" fill="#ffffff" stroke="#fbcfe8" stroke-width="4" transform="rotate(-12 60 45)"/>
    <ellipse cx="60" cy="45" rx="7" ry="26" fill="#f472b6" transform="rotate(-12 60 45)"/>
    <!-- Tai thỏ phải -->
    <ellipse cx="100" cy="45" rx="14" ry="40" fill="#ffffff" stroke="#fbcfe8" stroke-width="4" transform="rotate(12 100 45)"/>
    <ellipse cx="100" cy="45" rx="7" ry="26" fill="#f472b6" transform="rotate(12 100 45)"/>
    <!-- Đầu thỏ -->
    <circle cx="80" cy="95" r="46" fill="#ffffff" stroke="#fbcfe8" stroke-width="3"/>
    <!-- Má hồng -->
    <ellipse cx="52" cy="105" rx="9" ry="6" fill="#fda4af" opacity="0.8"/>
    <ellipse cx="108" cy="105" rx="9" ry="6" fill="#fda4af" opacity="0.8"/>
    <!-- Mắt long lanh -->
    <circle cx="62" cy="92" r="6" fill="#1e293b"/>
    <circle cx="64" cy="90" r="2" fill="#ffffff"/>
    <circle cx="98" cy="92" r="6" fill="#1e293b"/>
    <circle cx="100" cy="90" r="2" fill="#ffffff"/>
    <!-- Mũi miệng -->
    <path d="M 77 102 Q 80 105 83 102" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Áo yếm xanh đáng yêu -->
    <path d="M 46 138 C 46 128, 114 128, 114 138 L 120 172 C 120 178, 40 178, 40 172 Z" fill="#38bdf8"/>
    <!-- Nút áo yếm -->
    <circle cx="62" cy="148" r="3.5" fill="#facc15"/>
    <circle cx="98" cy="148" r="3.5" fill="#facc15"/>
    <!-- Nơ cổ hồng -->
    <polygon points="80,132 70,126 70,138" fill="#ec4899"/>
    <polygon points="80,132 90,126 90,138" fill="#ec4899"/>
    <circle cx="80" cy="132" r="3" fill="#f43f5e"/>
