<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#ribbonShadow)">
    <!-- Cánh nơ trái -->
    <path d="M 110 40 C 60 10, 20 20, 30 55 C 40 85, 95 65, 110 45 Z" fill="url(#ribbonGrad)" stroke="#e0f2fe" stroke-width="2"/>
    <!-- Cánh nơ phải -->
    <path d="M 110 40 C 160 10, 200 20, 190 55 C 180 85, 125 65, 110 45 Z" fill="url(#ribbonGrad)" stroke="#e0f2fe" stroke-width="2"/>
    <!-- Dải ruy băng rủ trái -->
    <path d="M 102 45 L 75 105 L 90 95 L 105 105 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Dải ruy băng rủ phải -->
    <path d="M 118 45 L 145 105 L 130 95 L 115 105 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Nút thắt giữa nơ -->
    <circle cx="110" cy="42" r="14" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
    <text x="110" y="47" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#000" text-anchor="middle">20/10</text>
  </g>
</svg>