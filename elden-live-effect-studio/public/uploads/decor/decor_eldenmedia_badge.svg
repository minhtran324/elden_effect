<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="50%" stop-color="#FFA751"/>
      <stop offset="100%" stop-color="#FF512F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="10" y="15" width="340" height="70" rx="35" fill="rgba(15, 23, 42, 0.88)" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="24" fill="url(#gold)"/>
  <text x="50" y="58" font-size="24" text-anchor="middle" font-family="sans-serif">🏺</text>
  <text x="195" y="46" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="1">HŨ QUÀ TẶNG</text>
  <text x="195" y="68" font-size="15" font-weight="700" fill="url(#gold)" text-anchor="middle" font-family="Arial, sans-serif">@eldenmedia</text>
</svg>