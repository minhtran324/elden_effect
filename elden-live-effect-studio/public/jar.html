<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🏺 Hũ Quà Rơi Vật Lý TikTok - LiveEffect Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important; /* OBS Browser Source transparent */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #stage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    canvas#physics-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD: MỤC TIÊU & TÍCH LUỸ XU */
    #goal-hud {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .goal-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(251, 191, 36, 0.25);
      border-radius: 999px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    .goal-icon {
      font-size: 1.4rem;
      animation: floatIcon 2s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .goal-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f1f5f9;
      text-transform: uppercase;
    }
    .goal-counter {
      font-size: 1.05rem;
      font-weight: 900;
      color: #fbbf24;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }
    .goal-bar-wrap {
      width: 280px;
      height: 8px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .goal-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #10b981);
      box-shadow: 0 0 8px #fbbf24;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* TOAST THÔNG BÁO QUÀ RƠI */
    #toast-container {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 101;
      pointer-events: none;
    }
    .gift-toast {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 6px 16px 6px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: toastIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-15px) scale(0.85); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-out {
      animation: toastOut 0.35s ease forwards !important;
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(-10px) scale(0.9); }
    }
    .toast-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #fbbf24;
      object-fit: cover;
      background: #1e293b;
    }
    .toast-text {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .toast-name {
      color: #38bdf8;
      font-weight: 700;
    }
    .toast-gift {
      color: #fbbf24;
      font-weight: 800;
    }

    /* FLASH TRẮNG KHI VỠ HŨ */
    #screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.1s ease;
    }

    /* BANNER CHÚC MỪNG HOÀN THÀNH MỤC TIÊU */
    #celebration-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #celebration-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .banner-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      padding: 12px 36px;
      border-radius: 999px;
      box-shadow: 0 10px 40px rgba(245, 158, 11, 0.6), 0 0 20px #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      border: 3px solid #fff;
    }
    .banner-sub {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 20px;
      border-radius: 999px;
    }
  </style>

  <!-- Nạp thư viện Matter.js chuẩn offline & Socket.io -->
  <script src="/vendor/matter.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="stage-container">
    <canvas id="physics-canvas"></canvas>

    <!-- MỤC TIÊU TIẾN TRÌNH HŨ -->
    <div id="goal-hud">
      <div class="goal-pill">
        <span class="goal-icon">🏺</span>
        <div>
          <span class="goal-title" id="hudGoalTitle">Mục Tiêu Đầy Hũ</span>
          <span style="margin: 0 6px; opacity: 0.5;">|</span>
          <span class="goal-counter" id="hudGoalCounter">0 / 500 Xu</span>
        </div>
      </div>
      <div class="goal-bar-wrap">
        <div class="goal-bar-fill" id="hudGoalFill"></div>
      </div>
    </div>

    <!-- TOAST QUÀ VỪA RƠI -->
    <div id="toast-container"></div>

    <!-- FLASH TRẮNG KHI VỠ -->
    <div id="screen-flash"></div>

    <!-- BANNER NỔ HŨ HOÀN THÀNH MỤC TIÊU -->
    <div id="celebration-banner">
      <div class="banner-badge">💥 HŨ ĐÃ ĐẦY & NỔ TUNG! 💥</div>
      <div class="banner-sub">Cảm ơn tất cả các Idol & Đại Gia đã ủng hộ! 💖</div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. WEB AUDIO API - TỔNG HỢP ÂM THANH CHÂN THỰC (ZERO DEPENDENCIES)
    // ==========================================
    const AudioEngine = {
      ctx: null,
      enabled: true,
      volume: 0.7,

      init() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        } catch (_) {}
      },

      ensureCtx() {
        if (!this.ctx) this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },

      // Tiếng va chạm lách cách kính trong trẻo khi quà rơi vào hũ
      playClink(pitch = 1.0) {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          const baseFreq = 1800 * pitch + (Math.random() * 400 - 200);
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + 0.12);

          gain.gain.setValueAtTime(0.25 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.13);
        } catch (_) {}
      },

      // Tiếng kính nứt rắc rắc sắc bén
      playCrack() {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.15;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(2500, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.6 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
        } catch (_) {}
      },

      // Tiếng rung lắc hũ trầm ồn
      playShake() {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(70, now + 0.35);

          gain.gain.setValueAtTime(0.5 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.36);
        } catch (_) {}
      },

      // Tiếng vỡ kính nổ tung hoành tráng
      playShatter() {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          // 1. Noise blast
          const bufferSize = this.ctx.sampleRate * 0.8;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1800, now);
          filter.Q.setValueAtTime(1.2, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.85 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.8);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);

          // 2. Sub bass boom
          const boom = this.ctx.createOscillator();
          const boomGain = this.ctx.createGain();
          boom.type = 'sine';
          boom.frequency.setValueAtTime(110, now);
          boom.frequency.exponentialRampToValueAtTime(30, now + 0.6);

          boomGain.gain.setValueAtTime(0.8 * this.volume, now);
          boomGain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

          boom.connect(boomGain);
          boomGain.connect(this.ctx.destination);

          boom.start(now);
          boom.stop(now + 0.65);
        } catch (_) {}
      },

      // Tiếng xả hũ / dốc ngược (Whoosh)
      playWhoosh() {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.5);

          gain.gain.setValueAtTime(0.4 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.51);
        } catch (_) {}
      },

      // Hợp âm chúc mừng Fanfare (C5, E5, G5, C6)
      playFanfare() {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          try {
            const now = this.ctx.currentTime + idx * 0.12;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.35 * this.volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.65);
          } catch (_) {}
        });
      }
    };

    // ==========================================
    // 2. KHỞI TẠO MATTER.JS & CẤU HÌNH HŨ
    // ==========================================
    const { Engine, World, Bodies, Body, Composite, Vector, Events } = Matter;

    const canvas = document.getElementById('physics-canvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      rebuildScreenBoundaries();
      rebuildJarBodies();
    });

    const engine = Engine.create({
      enableSleeping: false
    });
    engine.world.gravity.y = 1.0;

    // Cấu hình hũ mặc định
    let jarConfig = {
      enabled: true,
      style: 'fishbowl',
      customJarImage: '/uploads/decor/iridescent_fishbowl_transparent.png',
      frontOverlayImage: '/uploads/decor/iridescent_fishbowl_front_overlay.png',
      hideDefaultJarOnCustom: true,
      decorImage: '',
      decorText: '',
      decorPosition: 'bottom',
      decorScale: 0.85,
      decorOpacity: 0.98,
      jarPosX: 50,
      jarPosY: 78,
      jarScale: 1.0,
      dropOrigin: 'top',
      dropMode: 'straight', // 'straight' | 'shower'
      dropSpread: 0.16,
      fallSpeed: 0.65,
      gravity: 1.05,
      shakeThreshold: 1000,
      enableFloorAccumulation: true,
      giftCapacity: 400,
      giftScaleGlobal: 0.85,
      giftSizeSmall: 16,
      giftSizeMedium: 26,
      giftSizeLarge: 38,
      giftSizeVIP: 54,
      glowEffect: true,
      sparkleEffect: true,
      shimmerRimEffect: true,
      shimmerRimSpeed: 1.0,
      shimmerSparkles: true,
      goalEnabled: false,
      goalTargetCoins: 500,
      currentCoins: 0,
      bounciness: 0.20,
      soundEnabled: true,
      soundVolume: 0.3,
      autoBurstOnGoal: false,
      autoResetSeconds: 5,
      jarAspect: 'square',
      debugHitbox: false,
      clipGiftsToJar: true,
      glassRealism: true,
      hitbox: {
        shape: 'sphere', // 'sphere' | 'bottle' | 'cylinder'
        radiusX: 0.31,
        radiusY: 0.24,
        centerY: 0.58,
        mouthY: 0.12,
        neckWidth: 0.38,
        neckHeight: 0.36,
        offsetX: 0,
        offsetY: 0,
        scaleX: 1.0,
        scaleY: 1.0
      },
      jarPadding: {
        top: 0,
        bottom: 0,
        left: 0,
        right: 0
      },
      stickers: []
    };

    // Trạng thái tương tác
    let jarState = {
      currentCoins: 0,
      crackLevel: 0, // 0: lành lặn, 1: nứt nhẹ, 2: nứt mạng nhện, 3: nứt nghiêm trọng
      isBurst: false,
      isFlipped: false,
      flipAngle: 0, // góc xoay radian của hũ
      shakeTrauma: 0, // độ rung lắc hiện tại (0 -> 1)
      shakeTime: 0
    };

    // Bộ nhớ cache ảnh để vẽ sprite mượt mà 60fps
    const imageCache = {};
    function preloadImage(url) {
      if (!url) return null;
      if (imageCache[url]) return imageCache[url];
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = url;
      imageCache[url] = img;
      return img;
    }

    // Danh sách các hạt mảnh kính, pháo hoa & bụi sáng
    let glassShards = [];
    let confettiParticles = [];
    let sparkleParticles = [];

    function spawnSparkleDust(x, y, coins) {
      const num = coins >= 100 ? 10 : 4;
      const colors = ['#fef08a', '#facc15', '#38bdf8', '#ffffff'];
      for (let i = 0; i < num; i++) {
        sparkleParticles.push({
          x: x + (Math.random() - 0.5) * 24,
          y: y + (Math.random() - 0.5) * 24,
          vx: (Math.random() - 0.5) * 2.2,
          vy: - (0.5 + Math.random() * 2),
          size: 2 + Math.random() * 3.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1.0,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    // ==========================================
    // 3. XÂY DỰNG HÌNH HỌC VẬT LÝ CỦA HŨ (COLLISION WALLS)
    // ==========================================
    let jarWalls = [];
    let jarGeometry = {
      cx: 0,
      cy: 0,
      w: 360,
      h: 490,
      neckW: 240,
      neckH: 60,
      wallThickness: 22
    };

    function calculateJarGeometry() {
      const scale = jarConfig.jarScale || 1.0;
      const posX = typeof jarConfig.jarPosX === 'number' ? jarConfig.jarPosX : 50;
      const posY = typeof jarConfig.jarPosY === 'number' ? jarConfig.jarPosY : 78;
      const aspect = jarConfig.jarAspect || 'square';
      const isFishbowl = aspect === 'square' || jarConfig.style === 'fishbowl' || (jarConfig.customJarImage && jarConfig.customJarImage.includes('fishbowl'));

      let baseW, baseH, neckW, neckH;
      if (isFishbowl) {
        // BỂ CẦU TRÒN PHA LÊ (Square 1:1)
        const minDim = Math.min(width * 0.88, height * 0.60);
        baseW = minDim;
        baseH = minDim;
        neckW = baseW * 0.44 * scale;
        neckH = baseH * 0.18 * scale;
      } else if (aspect === 'horizontal') {
        baseW = Math.min(560, width * 0.85);
        baseH = Math.min(380, height * 0.45);
        neckW = baseW * 0.78 * scale;
        neckH = 42 * scale;
      } else {
        baseW = Math.min(380, width * 0.75);
        baseH = Math.min(500, height * 0.55);
        neckW = baseW * 0.68 * scale;
        neckH = 55 * scale;
      }

      const w = baseW * scale;
      const h = baseH * scale;
      const wallThickness = 28 * scale;

      // Tâm (cx, cy) chuẩn xác theo % vị trí
      const cx = (width * posX) / 100;
      const cy = (height * posY) / 100;

      const imgW = w;
      const imgH = h;
      const imgX = cx - w / 2;
      const imgY = cy - h / 2;

      const hitboxCfg = jarConfig.hitbox || {};
      const rx = w * (hitboxCfg.radiusX !== undefined ? hitboxCfg.radiusX : 0.315);
      const ry = h * (hitboxCfg.radiusY !== undefined ? hitboxCfg.radiusY : 0.24);
      const cavityCy = imgY + h * (hitboxCfg.centerY !== undefined ? hitboxCfg.centerY : 0.58) + (hitboxCfg.offsetY || 0);
      const cavityCx = cx + (hitboxCfg.offsetX || 0);
      const mouthY = imgY + h * (hitboxCfg.mouthY !== undefined ? hitboxCfg.mouthY : 0.12);
      const mouthW = w * (hitboxCfg.neckWidth !== undefined ? hitboxCfg.neckWidth : 0.38);

      jarGeometry = {
        cx,
        cy,
        w,
        h,
        imgX,
        imgY,
        imgW,
        imgH,
        neckW: mouthW,
        neckH,
        wallThickness,
        aspect,
        isFishbowl,
        bowlCx: cavityCx,
        bowlCy: cavityCy,
        bowlR: rx,
        mouthY,
        mouthW
      };
    }

    // Tường bao đáy màn hình & 2 biên trái phải để quà tràn hũ rơi xuống đất chồng chất
    let screenBoundaries = [];
    function rebuildScreenBoundaries() {
      if (screenBoundaries.length > 0) {
        World.remove(engine.world, screenBoundaries);
        screenBoundaries = [];
      }
      if (jarConfig.enableFloorAccumulation !== false) {
        // Đáy sàn màn hình ở y = height
        const floor = Bodies.rectangle(width / 2, height + 15, width * 3, 30, {
          isStatic: true,
          friction: 0.85,
          restitution: 0.15,
          label: 'screen_floor'
        });
        // Tường bên trái màn hình
        const leftWall = Bodies.rectangle(-15, height / 2, 30, height * 4, {
          isStatic: true,
          friction: 0.2,
          restitution: 0.2,
          label: 'screen_wall'
        });
        // Tường bên phải màn hình
        const rightWall = Bodies.rectangle(width + 15, height / 2, 30, height * 4, {
          isStatic: true,
          friction: 0.2,
          restitution: 0.2,
          label: 'screen_wall'
        });
        screenBoundaries = [floor, leftWall, rightWall];
        World.add(engine.world, screenBoundaries);
      }
    }

    // Lưu trữ đỉnh của lòng hũ cho clipping và debug hitbox
    let currentCavityPoints = [];

    function getCavityPoints(geom, hitboxCfg) {
      const shape = hitboxCfg.shape || (geom.isFishbowl ? 'sphere' : 'cylinder');
      const { cx, imgY, w, h } = geom;

      const defaultRx = shape === 'sphere' ? 0.315 : (shape === 'bottle' ? 0.28 : 0.32);
      const defaultRy = shape === 'sphere' ? 0.24 : (shape === 'bottle' ? 0.26 : 0.30);
      const defaultCy = shape === 'sphere' ? 0.58 : (shape === 'bottle' ? 0.62 : 0.56);
      const defaultMouthY = 0.12;
      const defaultNeckW = shape === 'bottle' ? 0.26 : 0.38;
      const defaultNeckH = shape === 'bottle' ? 0.26 : 0.20;

      const rx = w * (hitboxCfg.radiusX !== undefined ? hitboxCfg.radiusX : defaultRx);
      const ry = h * (hitboxCfg.radiusY !== undefined ? hitboxCfg.radiusY : defaultRy);
      const cavityCy = imgY + h * (hitboxCfg.centerY !== undefined ? hitboxCfg.centerY : defaultCy) + (hitboxCfg.offsetY || 0);
      const cavityCx = cx + (hitboxCfg.offsetX || 0);
      const mouthY = imgY + h * (hitboxCfg.mouthY !== undefined ? hitboxCfg.mouthY : defaultMouthY);
      const mouthHalfW = (w * (hitboxCfg.neckWidth !== undefined ? hitboxCfg.neckWidth : defaultNeckW)) / 2;
      const neckH = h * (hitboxCfg.neckHeight !== undefined ? hitboxCfg.neckHeight : defaultNeckH);
      const neckBottomY = mouthY + neckH;

      const points = [];

      if (shape === 'sphere') {
        // 🔮 BỂ CẦU TRÒN (Sphere / Fishbowl)
        points.push({ x: cavityCx + mouthHalfW, y: mouthY });
        const neckHalfW = mouthHalfW * 1.05;
        points.push({ x: cavityCx + neckHalfW, y: neckBottomY });

        const shoulderSteps = 8;
        for (let i = 1; i <= shoulderSteps; i++) {
          const f = i / shoulderSteps;
          const ease = f * f * (3 - 2 * f);
          const px = cavityCx + neckHalfW + (rx - neckHalfW) * Math.sin(f * Math.PI * 0.5);
          const py = neckBottomY + (cavityCy - neckBottomY) * ease;
          points.push({ x: px, y: py });
        }

        const arcSteps = 24;
        for (let i = 1; i <= arcSteps; i++) {
          const angle = (Math.PI * i) / arcSteps;
          const px = cavityCx + rx * Math.cos(angle);
          const py = cavityCy + ry * Math.sin(angle);
          points.push({ x: px, y: py });
        }

        for (let i = shoulderSteps - 1; i >= 0; i--) {
          const f = i / shoulderSteps;
          const ease = f * f * (3 - 2 * f);
          const px = cavityCx - (neckHalfW + (rx - neckHalfW) * Math.sin(f * Math.PI * 0.5));
          const py = neckBottomY + (cavityCy - neckBottomY) * ease;
          points.push({ x: px, y: py });
        }

        points.push({ x: cavityCx - mouthHalfW, y: mouthY });

      } else if (shape === 'bottle') {
        // 🏺 HŨ CỔ LỌ / BÌNH HOA (Bottle / Vase)
        points.push({ x: cavityCx + mouthHalfW, y: mouthY });
        points.push({ x: cavityCx + mouthHalfW, y: neckBottomY });

        const thetaJoin = -0.22 * Math.PI;
        const joinX = rx * Math.cos(thetaJoin);
        const joinY = ry * Math.sin(thetaJoin);

        const shoulderSteps = 10;
        for (let i = 1; i <= shoulderSteps; i++) {
          const f = i / shoulderSteps;
          const ease = f * f * (3 - 2 * f);
          const px = cavityCx + mouthHalfW + (joinX - mouthHalfW) * ease;
          const py = neckBottomY + (cavityCy + joinY - neckBottomY) * f;
          points.push({ x: px, y: py });
        }

        const arcSteps = 28;
        const thetaEnd = Math.PI - thetaJoin;
        for (let i = 1; i <= arcSteps; i++) {
          const angle = thetaJoin + ((thetaEnd - thetaJoin) * i) / arcSteps;
          const px = cavityCx + rx * Math.cos(angle);
          const py = cavityCy + ry * Math.sin(angle);
          points.push({ x: px, y: py });
        }

        for (let i = shoulderSteps; i >= 1; i--) {
          const f = (i - 1) / shoulderSteps;
          const ease = f * f * (3 - 2 * f);
          const px = cavityCx - (mouthHalfW + (joinX - mouthHalfW) * ease);
          const py = neckBottomY + (cavityCy + joinY - neckBottomY) * f;
          points.push({ x: px, y: py });
        }

        points.push({ x: cavityCx - mouthHalfW, y: mouthY });

      } else {
        // 🥛 HŨ TRỤ ĐỨNG / MASON JAR (Cylinder)
        const bottomY = cavityCy + ry;
        const cornerR = Math.min(rx * 0.35, 36);

        points.push({ x: cavityCx + mouthHalfW, y: mouthY });
        points.push({ x: cavityCx + mouthHalfW, y: mouthY + 24 });
        points.push({ x: cavityCx + rx, y: mouthY + 44 });
        points.push({ x: cavityCx + rx, y: bottomY - cornerR });

        for (let i = 1; i <= 6; i++) {
          const a = (Math.PI * 0.5) * (i / 6);
          points.push({
            x: cavityCx + rx - cornerR + cornerR * Math.cos(a),
            y: bottomY - cornerR + cornerR * Math.sin(a)
          });
        }

        for (let i = 1; i <= 6; i++) {
          const a = (Math.PI * 0.5) + (Math.PI * 0.5) * (i / 6);
          points.push({
            x: cavityCx - rx + cornerR + cornerR * Math.cos(a),
            y: bottomY - cornerR + cornerR * Math.sin(a)
          });
        }

        points.push({ x: cavityCx - rx, y: mouthY + 44 });
        points.push({ x: cavityCx - mouthHalfW, y: mouthY + 24 });
        points.push({ x: cavityCx - mouthHalfW, y: mouthY });
      }

      return points;
    }

    function rebuildJarBodies() {
      // Xoá các tường cũ nếu có
      if (jarWalls.length > 0) {
        World.remove(engine.world, jarWalls);
        jarWalls = [];
      }

      if (jarState.isBurst) return;

      calculateJarGeometry();
      const hitboxCfg = jarConfig.hitbox || {};
      const { cx, w, h, imgY } = jarGeometry;
      const bounciness = Math.min(Number(jarConfig.bounciness) || 0.22, 0.22);
      const wallThickness = 28 * (jarConfig.jarScale || 1.0);

      currentCavityPoints = getCavityPoints(jarGeometry, hitboxCfg);

      // Tạo các phân đoạn va chạm kín khít 100% không kẽ hở
      for (let i = 0; i < currentCavityPoints.length - 1; i++) {
        const p1 = currentCavityPoints[i];
        const p2 = currentCavityPoints[i + 1];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);
        if (len < 1) continue;

        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const angle = Math.atan2(dy, dx);

        const seg = Bodies.rectangle(midX, midY, len * 1.55, wallThickness, {
          isStatic: true,
          angle: angle,
          friction: 0.25,
          restitution: bounciness,
          label: 'jar_wall'
        });
        jarWalls.push(seg);
      }

      // 2 Phễu định hướng dẫn quà rơi chuẩn xác qua miệng hũ
      const mouthY = currentCavityPoints[0].y;
      const mouthRightX = currentCavityPoints[0].x;
      const mouthLeftX = currentCavityPoints[currentCavityPoints.length - 1].x;

      const leftFunnel = Bodies.rectangle(mouthLeftX - w * 0.08, mouthY - 20, w * 0.18, wallThickness, {
        isStatic: true,
        angle: 0.65,
        friction: 0.1,
        restitution: bounciness,
        label: 'jar_wall'
      });
      const rightFunnel = Bodies.rectangle(mouthRightX + w * 0.08, mouthY - 20, w * 0.18, wallThickness, {
        isStatic: true,
        angle: -0.65,
        friction: 0.1,
        restitution: bounciness,
        label: 'jar_wall'
      });

      jarWalls.push(leftFunnel, rightFunnel);
      World.add(engine.world, jarWalls);
    }

    rebuildScreenBoundaries();
    rebuildJarBodies();
     // ==========================================
    // 4. QUẢN LÝ QUÀ TẶNG & THẢ QUÀ VẬT LÝ (GIFT PHYSICS BODY)
    // ==========================================
    let giftBodies = [];
    // Tính bán kính hiển thị và va chạm theo xu & cài đặt kích thước
    function getGiftRadius(coins, giftId) {
      const global = Number(jarConfig.giftScaleGlobal) || 1.0;
      const numCoins = Number(coins) || 1;
      let baseR = 15;
      if (numCoins <= 9) {
        baseR = Number(jarConfig.giftSizeSmall) || 12;
      } else if (numCoins <= 99) {
        baseR = Number(jarConfig.giftSizeMedium) || 22;
      } else if (numCoins <= 999) {
        baseR = Number(jarConfig.giftSizeLarge) || 32;
      } else {
        baseR = Number(jarConfig.giftSizeVIP) || 48;
      }
      return Math.max(5, Math.round(baseR * global));
    }

    // Co giãn kích thước tất cả các quà ĐÃ RƠI TRONG HŨ ngay lập tức theo thời gian thực & Tự động nén dồn xuống đáy
    function resizeActiveGiftBodies() {
      const { bowlCx, bowlCy, bowlR, isFishbowl, cx, cy, h } = jarGeometry;
      const targetFloorY = isFishbowl ? (bowlCy + bowlR - 12) : (cy + h / 2 - 20);

      giftBodies.forEach(b => {
        if (!b || !b.giftData) return;
        const targetR = getGiftRadius(b.giftData.coins, b.giftData.giftId);
        const curR = b.giftData.radius || b.circleRadius || 18;
        if (Math.abs(targetR - curR) > 0.4) {
          const scaleFactor = targetR / curR;
          Body.scale(b, scaleFactor, scaleFactor);
          b.giftData.radius = targetR;
          b.circleRadius = targetR;

          // Đánh thức vật thể đang ngủ
          Matter.Sleeping.set(b, false);
          b.isSleeping = false;

          // Nếu co nhỏ lại, tự động nén dồn tọa độ xuống đáy hũ để tránh khoảng trống rời rạc
          if (scaleFactor < 0.99) {
            b.position.y += (targetFloorY - b.position.y) * (1 - scaleFactor) * 0.72;
            b.position.x += (bowlCx - b.position.x) * (1 - scaleFactor) * 0.35;
          }

          // Cấp vận tốc dồn rơi tự nhiên
          Body.setVelocity(b, {
            x: (bowlCx - b.position.x) * 0.04 + (Math.random() - 0.5) * 0.4,
            y: Math.max(b.velocity.y, 2.5)
          });
        }
      });
    }


    function dropGift(data) {
      if (!jarConfig.enabled) return;

      const { cx, cy, h, neckW } = jarGeometry;
      const coins = Number(data.coins) || 1;
      const count = Math.min(Number(data.count) || 1, 50);

      const radius = getGiftRadius(coins, data.giftId);
      const dropOrigin = jarConfig.dropOrigin || 'top';
      const dropMode = jarConfig.dropMode || 'straight';
      const fallSpeed = Number(jarConfig.fallSpeed) || 1.0;
      const gravity = Number(jarConfig.gravity) || 1.0;
      engine.world.gravity.y = gravity * fallSpeed;

      const maxCapacity = Number(jarConfig.giftCapacity) || 600;

      // Tiền tải icon
      if (data.iconUrl) preloadImage(data.iconUrl);

      // Tốc độ so le giữa các quà: rơi thẳng lần lượt hoặc mưa tản nhẹ
      const intervalMs = dropMode === 'straight'
        ? Math.max(35, Math.round(60 / fallSpeed))
        : Math.max(25, Math.round(40 / fallSpeed));

      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (jarState.isBurst) return;

          // Xoá bớt quà cũ nếu vượt quá giới hạn tối đa
          if (giftBodies.length >= maxCapacity) {
            const oldest = giftBodies.shift();
            World.remove(engine.world, oldest);
          }

          // Tính toán vị trí spawnY theo dropOrigin
          let spawnY = -40;
          if (dropOrigin === 'middle') {
            spawnY = Math.min(cy - h / 2 - 40, height * 0.35) + (Math.random() - 0.5) * 20;
          } else if (dropOrigin === 'mouth') {
            spawnY = (jarGeometry.mouthY || (cy - h / 2 + 30)) - 30 - Math.random() * 15;
          } else {
            spawnY = -40 - Math.random() * 25;
          }

          // Vị trí rơi ngang spawnX và vận tốc ngang vx
          let spawnX = cx;
          let vx = 0;

          if (dropMode === 'straight') {
            // RƠI THẲNG LẦN LƯỢT: spawn ngay giữa miệng hũ, không văng ngang
            spawnX = cx + (Math.random() - 0.5) * 10;
            vx = 0;
          } else {
            // MƯA TẢN NHẸ
            const spread = jarConfig.dropSpread !== undefined ? jarConfig.dropSpread : 0.35;
            spawnX = cx + (Math.random() - 0.5) * (neckW * spread);
            vx = (cx - spawnX) * 0.03 + (Math.random() - 0.5) * 0.8;
          }

          const body = Bodies.circle(spawnX, spawnY, radius, {
            restitution: 0.18,
            friction: 0.22, // ma sát vừa phải giúp quà lăn mượt mà tạo đống chóp tự nhiên
            frictionAir: 0.007,
            density: 0.002 * (coins >= 100 ? 2.0 : 1.0),
            angle: (Math.random() - 0.5) * 0.5,
            label: 'gift_item'
          });

          // Gán thông tin hiển thị
          body.giftData = {
            giftId: data.giftId,
            giftName: data.giftName,
            coins: coins,
            iconUrl: data.iconUrl,
            sender: data.sender,
            avatar: data.avatar,
            radius,
            createdTime: Date.now()
          };

          const baseVy = dropOrigin === 'top' ? (5.5 + Math.random() * 3) : (dropOrigin === 'middle' ? 4 + Math.random() * 2 : 2 + Math.random() * 2);
          const vy = baseVy * fallSpeed;

          Body.setVelocity(body, { x: vx, y: vy });

          World.add(engine.world, body);
          giftBodies.push(body);

          // Tạo vệt bụi sáng lấp lánh (Sparkle dust)
          if (jarConfig.sparkleEffect !== false) {
            spawnSparkleDust(spawnX, spawnY, coins);
          }

          // Phát âm thanh va chạm lách cách
          AudioEngine.playClink(radius > 30 ? 0.7 : 1.2);

        }, i * intervalMs);
      }

      // Cập nhật mục tiêu và hiển thị thông báo toast
      updateGoal(coins * (Number(data.count) || 1));
      showGiftToast(data);

      // Nếu quà to >= shakeThreshold, tự động kích hoạt rung hũ kịch tính!
      const shakeThresh = Number(jarConfig.shakeThreshold) || 50;
      if (coins >= shakeThresh) {
        triggerAction({ action: 'shake', intensity: Math.min(2.0, 1 + coins / 500) });
      }
    }

    // ==========================================
    // 5. HIỆU ỨNG TƯƠNG TÁC (SHAKE, CRACK, FLIP, BURST, CLEAR)
    // ==========================================
    function triggerAction(payload) {
      const action = payload.action;
      const intensity = payload.intensity || 1.0;

      switch (action) {
        case 'shake':
          // 1. Rung lắc hũ + Nảy quà bên trong
          jarState.shakeTrauma = Math.min(1.0, jarState.shakeTrauma + 0.6 * intensity);
          AudioEngine.playShake();

          // Tác động lực đẩy nảy tất cả các quà trong hũ
          giftBodies.forEach(b => {
            Body.setVelocity(b, {
              x: b.velocity.x + (Math.random() - 0.5) * 8 * intensity,
              y: - (5 + Math.random() * 9 * intensity)
            });
          });
          break;

        case 'crack':
          // 2. Nứt hũ (tăng từng cấp độ 1 -> 2 -> 3)
          jarState.crackLevel = Math.min(3, jarState.crackLevel + 1);
          AudioEngine.playCrack();
          jarState.shakeTrauma = Math.max(jarState.shakeTrauma, 0.4);

          // Tạo chút bụi kính bắn ra
          spawnGlassDust();
          break;

        case 'flip':
          // 3. Lật hũ (Xả toàn bộ quà dốc ngược 180 độ)
          if (jarState.isFlipped) return;
          flipJarAndDump();
          break;

        case 'burst':
          // 4. Nổ tung / Vỡ hũ tan tành
          burstJarExplode();
          break;

        case 'clear':
          // 5. Dọn sạch quà
          clearAllGifts();
          break;

        case 'reset':
          // 6. Reset mục tiêu và vết nứt
          resetJarGoal();
          break;
      }
    }

    // --- HIỆU ỨNG LẬT HŨ (XẢ QUÀ) ---
    function flipJarAndDump() {
      jarState.isFlipped = true;
      AudioEngine.playWhoosh();

      // Xoá các tường vật lý hiện tại
      if (jarWalls.length > 0) {
        World.remove(engine.world, jarWalls);
        jarWalls = [];
      }

      // Đẩy quà trút ngược xuống sàn
      giftBodies.forEach(b => {
        Body.setVelocity(b, {
          x: (Math.random() - 0.5) * 8,
          y: 6 + Math.random() * 8
        });
      });

      // Animate xoay hũ 180 độ
      let start = null;
      const dur = 1000;

      function animFlip(ts) {
        if (!start) start = ts;
        const progress = Math.min(1, (ts - start) / dur);
        // Easing cubic
        const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
        jarState.flipAngle = ease * Math.PI;

        if (progress < 1) {
          requestAnimationFrame(animFlip);
        } else {
          // Chờ quà đổ hết ra ngoài trong 2.5s rồi lật thẳng lại
          setTimeout(() => {
            animateJarBackUpright();
          }, 2500);
        }
      }
      requestAnimationFrame(animFlip);
    }

    function animateJarBackUpright() {
      let start = null;
      const dur = 900;
      const fromAngle = jarState.flipAngle;

      function animUp(ts) {
        if (!start) start = ts;
        const progress = Math.min(1, (ts - start) / dur);
        const ease = 1 - Math.pow(1 - progress, 3);
        jarState.flipAngle = fromAngle + ease * (Math.PI * 2 - fromAngle);

        if (progress < 1) {
          requestAnimationFrame(animUp);
        } else {
          jarState.flipAngle = 0;
          jarState.isFlipped = false;
          // Xoá sạch các quà đã rơi ra ngoài
          giftBodies.forEach(b => World.remove(engine.world, b));
          giftBodies = [];
          rebuildJarBodies();
        }
      }
      requestAnimationFrame(animUp);
    }

    // --- HIỆU ỨNG NỔ TUNG HŨ (BURST / EXPLODE) ---
    function burstJarExplode() {
      if (jarState.isBurst) return;
      jarState.isBurst = true;

      AudioEngine.playShatter();
      AudioEngine.playFanfare();

      // Flash trắng màn hình kịch tính
      const flash = document.getElementById('screen-flash');
      flash.style.opacity = '0.9';
      setTimeout(() => { flash.style.opacity = '0'; }, 220);

      // Hiện banner chúc mừng
      const banner = document.getElementById('celebration-banner');
      banner.classList.add('show');
      setTimeout(() => { banner.classList.remove('show'); }, 4000);

      // Tháo bỏ hoàn toàn tường hũ
      if (jarWalls.length > 0) {
        World.remove(engine.world, jarWalls);
        jarWalls = [];
      }

      const { cx, cy } = jarGeometry;

      // 1. Nổ tung quà văng tứ phía
      giftBodies.forEach(b => {
        const dx = b.position.x - cx;
        const dy = b.position.y - cy;
        const dist = Math.hypot(dx, dy) || 1;
        const speed = 14 + Math.random() * 16;
        Body.setVelocity(b, {
          x: (dx / dist) * speed,
          y: (dy / dist) * speed - 8
        });
        Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.4);
      });

      // 2. Tạo 90 mảnh kính vỡ bay lấp lánh
      glassShards = [];
      for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 6 + Math.random() * 22;
        glassShards.push({
          x: cx + (Math.random() - 0.5) * 200,
          y: cy + (Math.random() - 0.5) * 300,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 6,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.35,
          size: 8 + Math.random() * 26,
          alpha: 1.0,
          points: [
            { x: 0, y: - (8 + Math.random() * 14) },
            { x: 6 + Math.random() * 14, y: 0 },
            { x: 0, y: 8 + Math.random() * 14 },
            { x: - (6 + Math.random() * 14), y: 2 }
          ]
        });
      }

      // 3. Tạo 160 hạt pháo hoa rực rỡ
      confettiParticles = [];
      const colors = ['#f59e0b', '#ef4444', '#10b981', '#38bdf8', '#a855f7', '#fbbf24', '#ffffff'];
      for (let i = 0; i < 160; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 5 + Math.random() * 20;
        confettiParticles.push({
          x: cx,
          y: cy - 40,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 10,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.4,
          w: 6 + Math.random() * 8,
          h: 10 + Math.random() * 14,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1.0
        });
      }

      // Tự động hồi sinh hũ sau số giây cấu hình
      const resetSec = jarConfig.autoResetSeconds || 5;
      setTimeout(() => {
        respawnJar();
      }, resetSec * 1000);
    }

    function spawnGlassDust() {
      const { cx, cy } = jarGeometry;
      for (let i = 0; i < 30; i++) {
        glassShards.push({
          x: cx + (Math.random() - 0.5) * 160,
          y: cy + (Math.random() - 0.5) * 220,
          vx: (Math.random() - 0.5) * 4,
          vy: - (1 + Math.random() * 4),
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.2,
          size: 4 + Math.random() * 8,
          alpha: 0.9,
          points: [
            { x: 0, y: -4 },
            { x: 4, y: 0 },
            { x: 0, y: 4 },
            { x: -4, y: 0 }
          ]
        });
      }
    }

    function respawnJar() {
      // Dọn sạch quà cũ và hạt
      giftBodies.forEach(b => World.remove(engine.world, b));
      giftBodies = [];
      glassShards = [];
      confettiParticles = [];

      jarState.isBurst = false;
      jarState.crackLevel = 0;
      jarState.isFlipped = false;
      jarState.flipAngle = 0;
      jarState.currentCoins = 0;

      rebuildJarBodies();
      updateGoal(0, true);

      // Hiệu ứng hồi sinh nảy nhẹ
      jarState.shakeTrauma = 0.5;
      AudioEngine.playFanfare();
    }

    function clearAllGifts() {
      giftBodies.forEach(b => World.remove(engine.world, b));
      giftBodies = [];
      jarState.currentCoins = 0;
      jarState.crackLevel = 0;
      updateGoal(0, true);
    }

    function resetJarGoal() {
      jarState.currentCoins = 0;
      jarState.crackLevel = 0;
      updateGoal(0, true);
    }

    // ==========================================
    // 6. TIẾN TRÌNH MỤC TIÊU & TỰ ĐỘNG NỨT/NỔ
    // ==========================================
    function updateGoal(addedCoins = 0, isReset = false) {
      if (isReset) {
        jarState.currentCoins = 0;
      } else {
        jarState.currentCoins += addedCoins;
      }

      const target = jarConfig.goalTargetCoins || 500;
      const curr = jarState.currentCoins;
      const pct = Math.min(100, Math.round((curr / target) * 100));

      const hud = document.getElementById('goal-hud');
      if (!jarConfig.goalEnabled) {
        hud.style.display = 'none';
        return;
      }
      hud.style.display = 'flex';

      document.getElementById('hudGoalCounter').textContent = `${curr.toLocaleString()} / ${target.toLocaleString()} Xu`;
      document.getElementById('hudGoalFill').style.width = `${pct}%`;

      // Tự động tăng vết nứt theo tiến trình
      if (!jarState.isBurst) {
        if (pct >= 90 && jarState.crackLevel < 3) {
          jarState.crackLevel = 3;
          AudioEngine.playCrack();
        } else if (pct >= 60 && jarState.crackLevel < 2) {
          jarState.crackLevel = 2;
          AudioEngine.playCrack();
        } else if (pct >= 30 && jarState.crackLevel < 1) {
          jarState.crackLevel = 1;
          AudioEngine.playCrack();
        }

        // Đạt 100% mục tiêu -> Tự động nổ hũ!
        if (curr >= target && jarConfig.autoBurstOnGoal) {
          setTimeout(() => {
            if (!jarState.isBurst) burstJarExplode();
          }, 300);
        }
      }
    }

    function showGiftToast(data) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'gift-toast';

      const avatarSrc = data.avatar || '';
      const count = Number(data.count) || 1;
      const giftName = data.giftName || 'Món Quà';
      const sender = data.sender || 'Người Xem';

      let avatarHtml = `<span style="font-size: 1.2rem;">🎁</span>`;
      if (avatarSrc) {
        avatarHtml = `<img class="toast-avatar" src="${avatarSrc}" onerror="this.outerHTML='<span style=\\'font-size: 1.2rem;\\'>🎁</span>'">`;
      }

      toast.innerHTML = `
        ${avatarHtml}
        <div class="toast-text">
          <span class="toast-name">${sender}</span> tặng <span class="toast-gift">${count > 1 ? count + 'x ' : ''}${giftName}</span>
        </div>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    // ==========================================
    // 7. RENDER VẼ HŨ & HIỆU ỨNG ĐỒ HOẠ (CANVAS 60FPS)
    // ==========================================

    // Vết nứt thủy tinh vẽ động
    function drawCracks(ctx, cx, cy, w, h, level) {
      if (level <= 0) return;

      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 2.0;
      ctx.shadowColor = 'rgba(186, 230, 253, 0.9)';
      ctx.shadowBlur = 6;

      ctx.beginPath();
      // Nhánh chính 1
      ctx.moveTo(cx - 30, cy + 20);
      ctx.lineTo(cx - 10, cy - 40);
      ctx.lineTo(cx + 40, cy - 60);
      ctx.lineTo(cx + 60, cy - 110);

      if (level >= 2) {
        // Nhánh phụ mạng nhện
        ctx.moveTo(cx - 10, cy - 40);
        ctx.lineTo(cx - 65, cy - 50);
        ctx.lineTo(cx - 95, cy - 20);

        ctx.moveTo(cx + 40, cy - 60);
        ctx.lineTo(cx + 75, cy - 40);
        ctx.lineTo(cx + 105, cy - 70);

        ctx.moveTo(cx - 30, cy + 20);
        ctx.lineTo(cx - 50, cy + 80);
        ctx.lineTo(cx - 30, cy + 130);
      }

      if (level >= 3) {
        // Nhánh vết nứt nghiêm trọng toàn thân
        ctx.moveTo(cx - 50, cy + 80);
        ctx.lineTo(cx + 20, cy + 100);
        ctx.lineTo(cx + 80, cy + 150);

        ctx.moveTo(cx + 60, cy - 110);
        ctx.lineTo(cx + 30, cy - 150);
        ctx.lineTo(cx - 20, cy - 170);

        ctx.lineWidth = 3.0;
        ctx.shadowBlur = 12;
      }
      ctx.stroke();
      ctx.restore();
    }

    // Hào quang neon phát sáng nhẹ xung quanh hũ (Ánh pha lê cầu vồng dịu dàng, trong suốt OBS)
    function drawAuraGlow(ctx, geom) {
      if (jarConfig.glowEffect === false) return;
      const { bowlCx, bowlCy, bowlR, isFishbowl, cx, cy, w } = geom;
      ctx.save();
      const pulse = 0.08 + 0.04 * Math.sin(Date.now() * 0.003);
      const centerX = isFishbowl ? bowlCx : cx;
      const centerY = isFishbowl ? bowlCy : cy;
      const rad = isFishbowl ? (bowlR * 1.35) : (w * 0.65);

      const grad = ctx.createRadialGradient(centerX, centerY, rad * 0.25, centerX, centerY, rad);
      grad.addColorStop(0, `rgba(254, 240, 138, ${pulse * 1.0})`);
      grad.addColorStop(0.45, `rgba(244, 114, 182, ${pulse * 0.45})`);
      grad.addColorStop(0.8, `rgba(186, 230, 253, ${pulse * 0.25})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Vẽ hình dáng hũ theo các phong cách (kể cả ảnh mẫu tùy chọn)
    function drawJarBackground(ctx, geom, style) {
      const { cx, cy, w, h, imgX, imgY, neckW, neckH, aspect, isFishbowl } = geom;
      const scale = jarConfig.jarScale || 1.0;

      ctx.save();

      // Kiểm tra xem có dùng hũ ảnh AI / Fishbowl không
      const hasCustomImage = !!jarConfig.customJarImage;
      const isFishbowlStyle = isFishbowl || style === 'fishbowl' || (hasCustomImage && jarConfig.customJarImage.includes('fishbowl'));

      if (hasCustomImage || isFishbowlStyle || style === 'custom_image') {
        const customUrl = jarConfig.customJarImage || '/uploads/decor/iridescent_fishbowl_transparent.png';
        const customImg = preloadImage(customUrl);
        if (customImg && customImg.complete && customImg.naturalWidth > 0) {
          ctx.drawImage(customImg, imgX, imgY, w, h);
        }
        ctx.restore();
        return; // KHÔNG BAO GIỜ VẼ HŨ VECTOR KHI DÙNG ẢNH HŨ
      }

      // Fallback chỉ dành cho hũ vector truyền thống nếu người dùng chủ động chọn mason jar
      const halfW = w / 2;
      const halfH = h / 2;
      const halfNeckW = neckW / 2;
      const cornerR = (aspect === 'horizontal' ? 44 : 36) * scale;
      const baseThick = (aspect === 'horizontal' ? 26 : 32) * scale;

      const grad = ctx.createLinearGradient(cx - halfW, cy, cx + halfW, cy);
      if (style === 'diamond') {
        grad.addColorStop(0, 'rgba(168, 85, 247, 0.28)');
        grad.addColorStop(0.15, 'rgba(216, 180, 254, 0.08)');
        grad.addColorStop(0.85, 'rgba(216, 180, 254, 0.08)');
        grad.addColorStop(1, 'rgba(168, 85, 247, 0.32)');
      } else {
        grad.addColorStop(0, 'rgba(56, 189, 248, 0.26)');
        grad.addColorStop(0.15, 'rgba(224, 242, 254, 0.06)');
        grad.addColorStop(0.85, 'rgba(224, 242, 254, 0.06)');
        grad.addColorStop(1, 'rgba(56, 189, 248, 0.30)');
      }

      ctx.fillStyle = grad;

      // Đường viền bo tròn đáy hũ & uốn lượn vai hũ
      ctx.beginPath();
      ctx.moveTo(cx - halfW + cornerR, cy + halfH);
      ctx.lineTo(cx + halfW - cornerR, cy + halfH);
      ctx.quadraticCurveTo(cx + halfW, cy + halfH, cx + halfW, cy + halfH - cornerR);
      ctx.lineTo(cx + halfW, cy - halfH + neckH + 24);
      ctx.quadraticCurveTo(cx + halfW, cy - halfH + neckH, cx + halfNeckW, cy - halfH + neckH);
      ctx.lineTo(cx + halfNeckW, cy - halfH);
      ctx.lineTo(cx - halfNeckW, cy - halfH);
      ctx.lineTo(cx - halfNeckW, cy - halfH + neckH);
      ctx.quadraticCurveTo(cx - halfW, cy - halfH + neckH, cx - halfW, cy - halfH + neckH + 24);
      ctx.lineTo(cx - halfW, cy + halfH - cornerR);
      ctx.quadraticCurveTo(cx - halfW, cy + halfH, cx - halfW + cornerR, cy + halfH);
      ctx.closePath();
      ctx.fill();

      // Đáy kính đúc nguyên khối dày dặn
      ctx.fillStyle = 'rgba(14, 165, 233, 0.24)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + halfH - baseThick * 0.45, halfW - cornerR * 0.4, baseThick * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawJarForegroundHighlights(ctx, geom, style) {
      const { cx, cy, w, h, imgX, imgY, neckW, neckH, aspect, isFishbowl } = geom;
      const scale = jarConfig.jarScale || 1.0;

      // 1. Nếu có ảnh Overlay mặt trước (Front Overlay: Nơ, cổ bèo, viền miệng hũ, bóng kính pha lê)
      const overlayUrl = jarConfig.frontOverlayImage || (isFishbowl ? '/uploads/decor/iridescent_fishbowl_front_overlay.png' : '');
      if (overlayUrl) {
        const overlayImg = preloadImage(overlayUrl);
        if (overlayImg && overlayImg.complete && overlayImg.naturalWidth > 0) {
          ctx.save();
          ctx.drawImage(overlayImg, imgX, imgY, w, h);
          ctx.restore();
          return;
        }
      }

      // Nếu đang dùng ảnh hũ riêng, tuyệt đối KHÔNG vẽ viền nét vector Mason jar đè lên
      if (jarConfig.customJarImage || isFishbowl || style === 'custom_image') return;

      const halfW = w / 2;
      const halfH = h / 2;
      const halfNeckW = neckW / 2;
      const cornerR = (aspect === 'horizontal' ? 44 : 36) * scale;

      ctx.save();

      // Vạch sáng phản chiếu dọc viền bo cong bên trái
      const lightGrad = ctx.createLinearGradient(cx - halfW + 10, cy, cx - halfW + 48, cy);
      lightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
      lightGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.18)');
      lightGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = lightGrad;
      ctx.beginPath();
      ctx.moveTo(cx - halfW + 14, cy - halfH + neckH + 28);
      ctx.lineTo(cx - halfW + 32, cy - halfH + neckH + 28);
      ctx.lineTo(cx - halfW + 30, cy + halfH - cornerR - 10);
      ctx.quadraticCurveTo(cx - halfW + 18, cy + halfH - 12, cx - halfW + cornerR, cy + halfH - 14);
      ctx.lineTo(cx - halfW + 14, cy + halfH - cornerR);
      ctx.closePath();
      ctx.fill();

      // Viền loá sáng mỏng thanh thoát dọc cạnh phải
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx + halfW - 14, cy - halfH + neckH + 30);
      ctx.lineTo(cx + halfW - 14, cy + halfH - cornerR);
      ctx.stroke();

      // Đường nét viền kính mềm mại theo đúng hình dáng hũ bo góc
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx - halfW + cornerR, cy + halfH);
      ctx.lineTo(cx + halfW - cornerR, cy + halfH);
      ctx.quadraticCurveTo(cx + halfW, cy + halfH, cx + halfW, cy + halfH - cornerR);
      ctx.lineTo(cx + halfW, cy - halfH + neckH + 24);
      ctx.quadraticCurveTo(cx + halfW, cy - halfH + neckH, cx + halfNeckW, cy - halfH + neckH);
      ctx.lineTo(cx + halfNeckW, cy - halfH);
      ctx.lineTo(cx - halfNeckW, cy - halfH);
      ctx.lineTo(cx - halfNeckW, cy - halfH + neckH);
      ctx.quadraticCurveTo(cx - halfW, cy - halfH + neckH, cx - halfW, cy - halfH + neckH + 24);
      ctx.lineTo(cx - halfW, cy + halfH - cornerR);
      ctx.quadraticCurveTo(cx - halfW, cy + halfH, cx - halfW + cornerR, cy + halfH);
      ctx.stroke();

      // Ren xoắn cổ hũ và vành miệng bo tròn
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(cx, cy - halfH + 4, halfNeckW + 4, 8, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    // Vẽ sticker / decor theo phân tầng ('behind_glass' hoặc 'front')
    function drawDecorStickers(ctx, geom, targetLayer = 'front') {
      const { cx, cy, w, h } = geom;
      const scale = jarConfig.jarScale || 1.0;

      // 1. Vẽ mảng stickers tùy chỉnh
      if (Array.isArray(jarConfig.stickers) && jarConfig.stickers.length > 0) {
        jarConfig.stickers.forEach(stk => {
          if (!stk || !stk.url) return;
          const stkLayer = stk.layer || 'front';
          if (stkLayer !== targetLayer) return;

          const img = preloadImage(stk.url);
          if (!img || !img.complete || img.naturalWidth === 0) return;

          const stkX = cx + ((stk.x !== undefined ? stk.x - 50 : 0) / 100) * w;
          const stkY = cy + ((stk.y !== undefined ? stk.y - 50 : 0) / 100) * h;
          const stkScale = (stk.scale || 1.0) * scale;
          const stkRot = ((stk.rotation || 0) * Math.PI) / 180;
          const stkAlpha = stk.opacity !== undefined ? stk.opacity : 1.0;

          const baseStkW = w * 0.52;
          const drawW = baseStkW * stkScale;
          const drawH = (img.naturalHeight / img.naturalWidth) * drawW;

          ctx.save();
          ctx.translate(stkX, stkY);
          ctx.rotate(stkRot);
          ctx.globalAlpha = stkAlpha;
          ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
          ctx.restore();
        });
      }

      // 2. Tương thích ngược decorImage đơn lẻ (nếu chưa có trong stickers)
      if (targetLayer === 'front' && jarConfig.decorImage) {
        const alreadyInStickers = Array.isArray(jarConfig.stickers) && jarConfig.stickers.some(s => s && s.url === jarConfig.decorImage);
        if (!alreadyInStickers) {
          const img = preloadImage(jarConfig.decorImage);
          if (img && img.complete && img.naturalWidth > 0) {
            let targetY = cy;
            if (jarConfig.decorPosition === 'top') targetY = cy - h * 0.28;
            else if (jarConfig.decorPosition === 'bottom') targetY = cy + h * 0.34;
            else if (jarConfig.decorPosition === 'neck') targetY = cy - h * 0.38;

            const dScale = (jarConfig.decorScale || 1.0) * scale;
            const opacity = jarConfig.decorOpacity !== undefined ? jarConfig.decorOpacity : 0.95;
            const targetW = (w * 0.52) * dScale;
            const targetH = (img.naturalHeight / img.naturalWidth) * targetW;

            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.drawImage(img, cx - targetW / 2, targetY - targetH / 2, targetW, targetH);
            ctx.restore();
          }
        }
      }
    }

    // ========================================================
    // HIỆU ỨNG DẢI SÁNG LẤP LÁNH CHẠY QUANH VIỀN HŨ (60FPS CAUSTIC SHIMMER & TWINKLING SPARKLES)
    // ========================================================
    let rimSparkles = [];

    function drawRealisticRimShimmer(ctx, geom, time) {
      if (jarConfig.shimmerRimEffect === false) return;
      const { cx, cy, w, h, imgX, imgY, bowlCx, bowlCy, bowlR, mouthY, mouthW, isFishbowl } = geom;
      const scale = jarConfig.jarScale || 1.0;
      const speed = Number(jarConfig.shimmerRimSpeed) || 1.0;

      // 1. Tọa độ vành miệng elip trên cùng
      const mouthX = bowlCx || cx;
      const topMouthY = imgY ? (imgY + h * 0.125) : (cy - h * 0.375);
      const mouthRx = w * 0.25;
      const mouthRy = h * 0.046;

      // Góc quét liên tục của chùm sáng
      const sweepAngle = (time * 0.0019 * speed) % (Math.PI * 2);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Điểm đầu của chùm sao chổi
      const headX = mouthX + Math.cos(sweepAngle) * mouthRx;
      const headY = topMouthY + Math.sin(sweepAngle) * mouthRy;

      // Vẽ vệt đuôi gradient ánh cầu vồng mềm mại
      const trailAngle = sweepAngle - 0.75;
      const tailX = mouthX + Math.cos(trailAngle) * mouthRx;
      const tailY = topMouthY + Math.sin(trailAngle) * mouthRy;

      const trailGrad = ctx.createLinearGradient(headX, headY, tailX, tailY);
      trailGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
      trailGrad.addColorStop(0.25, 'rgba(167, 243, 208, 0.75)');
      trailGrad.addColorStop(0.65, 'rgba(244, 114, 182, 0.4)');
      trailGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.strokeStyle = trailGrad;
      ctx.lineWidth = 3.8 * scale;
      ctx.beginPath();
      ctx.ellipse(mouthX, topMouthY, mouthRx, mouthRy, 0, trailAngle, sweepAngle, false);
      ctx.stroke();

      // Hào quang tỏa sáng tại đầu chùm tia sáng
      const flareGrad = ctx.createRadialGradient(headX, headY, 0, headX, headY, 20 * scale);
      flareGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      flareGrad.addColorStop(0.3, 'rgba(253, 224, 71, 0.85)');
      flareGrad.addColorStop(0.6, 'rgba(244, 114, 182, 0.35)');
      flareGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = flareGrad;
      ctx.beginPath();
      ctx.arc(headX, headY, 20 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Sao 4 cánh lấp lánh tại tâm chùm sáng
      drawDiamondStar(ctx, headX, headY, 14 * scale, 1.0, '#ffffff');

      // 2. Chùm sáng thứ hai chạy êm đềm dọc đường viền bụng dưới hũ pha lê
      const bellyCenterY = bowlCy || (cy + h * 0.08);
      const bellyRadius = bowlR || ((w / 2) * 0.88);
      const bellySweep = Math.PI * 0.18 + (Math.sin(time * 0.0014 * speed) * 0.5 + 0.5) * (Math.PI * 0.64);
      const bellyX = (bowlCx || cx) + Math.cos(bellySweep) * bellyRadius;
      const bellyPtY = bellyCenterY + Math.sin(bellySweep) * bellyRadius;

      const bFlare = ctx.createRadialGradient(bellyX, bellyPtY, 0, bellyX, bellyPtY, 18 * scale);
      bFlare.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      bFlare.addColorStop(0.4, 'rgba(125, 211, 252, 0.5)');
      bFlare.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = bFlare;
      ctx.beginPath();
      ctx.arc(bellyX, bellyPtY, 18 * scale, 0, Math.PI * 2);
      ctx.fill();

      // 3. Các ngôi sao pha lê nhấp nháy tĩnh tại các điểm nhấn (Nơ hồng, ngọc trai, ren cổ)
      const bowPulse = (Math.sin(time * 0.0032) * 0.5 + 0.5);
      drawDiamondStar(ctx, (bowlCx || cx) + w * 0.33, (imgY ? imgY + h * 0.27 : cy - h * 0.26), (12 + bowPulse * 8) * scale, 0.4 + bowPulse * 0.6, '#ffd1dc');

      const pearlPulse = (Math.sin(time * 0.004 + 1.5) * 0.5 + 0.5);
      drawDiamondStar(ctx, (bowlCx || cx) + w * 0.31, (imgY ? imgY + h * 0.35 : cy - h * 0.17), (10 + pearlPulse * 7) * scale, 0.35 + pearlPulse * 0.65, '#e0f2fe');

      const leftPulse = (Math.sin(time * 0.0036 + 3.0) * 0.5 + 0.5);
      drawDiamondStar(ctx, (bowlCx || cx) - w * 0.31, (imgY ? imgY + h * 0.22 : cy - h * 0.32), (10 + leftPulse * 6) * scale, 0.35 + leftPulse * 0.65, '#fef08a');

      // 4. Các hạt sao lấp lánh ngẫu nhiên sinh ra dọc viền hũ
      if (jarConfig.shimmerSparkles !== false && Math.random() < 0.14) {
        const onRim = Math.random() < 0.65;
        let sx, sy;
        if (onRim) {
          const a = Math.random() * Math.PI * 2;
          sx = mouthX + Math.cos(a) * mouthRx + (Math.random() - 0.5) * 6;
          sy = topMouthY + Math.sin(a) * mouthRy + (Math.random() - 0.5) * 6;
        } else {
          const a = Math.PI * 0.15 + Math.random() * Math.PI * 0.7;
          sx = (bowlCx || cx) + Math.cos(a) * bellyRadius + (Math.random() - 0.5) * 8;
          sy = bellyCenterY + Math.sin(a) * bellyRadius + (Math.random() - 0.5) * 8;
        }
        rimSparkles.push({
          x: sx,
          y: sy,
          size: (5 + Math.random() * 8) * scale,
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.06,
          alpha: 1.0,
          decay: 0.02 + Math.random() * 0.025,
          color: ['#ffffff', '#fde047', '#f472b6', '#38bdf8', '#a7f3d0'][Math.floor(Math.random() * 5)]
        });
      }

      for (let i = rimSparkles.length - 1; i >= 0; i--) {
        const s = rimSparkles[i];
        s.alpha -= s.decay;
        s.rot += s.vrot;
        if (s.alpha <= 0) {
          rimSparkles.splice(i, 1);
          continue;
        }
        drawDiamondStar(ctx, s.x, s.y, s.size, s.alpha, s.color, s.rot);
      }

      ctx.restore();
    }

    // Hàm vẽ ngôi sao 4 cánh lấp lánh (Diamond Starburst)
    function drawDiamondStar(ctx, x, y, size, alpha, color, rot = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

      // Lõi sáng trung tâm
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.75);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, color);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.75, 0, Math.PI * 2);
      ctx.fill();

      // Cánh sao dọc nhọn mềm mại
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.quadraticCurveTo(size * 0.12, 0, 0, size);
      ctx.quadraticCurveTo(-size * 0.12, 0, 0, -size);
      ctx.fill();

      // Cánh sao ngang
      ctx.beginPath();
      ctx.moveTo(-size, 0);
      ctx.quadraticCurveTo(0, size * 0.12, size, 0);
      ctx.quadraticCurveTo(0, -size * 0.12, -size, 0);
      ctx.fill();

      ctx.restore();
    }

    // ========================================================
    // ĐỒ HỌA THỦY TINH 3D CHÂN THỰC (REALISTIC GLASS OPTICS)
    // ========================================================

    // 1. Chiều sâu không gian 3D lòng hũ kính (vẽ TRƯỚC quà)
    function drawInnerGlassDepth(ctx, geom) {
      // Giữ lòng hũ trong suốt 100% tự nhiên theo ảnh hũ gốc
    }

    // 2. Lớp phản chiếu ánh sáng và vệt bóng mặt kính trước (vẽ TRÊN quà)
    function drawGlassFrontReflection(ctx, geom) {
      if (jarConfig.glassRealism === false) return;
      const hitboxCfg = jarConfig.hitbox || {};
      const rx = geom.w * (hitboxCfg.radiusX !== undefined ? hitboxCfg.radiusX : 0.315);
      const ry = geom.h * (hitboxCfg.radiusY !== undefined ? hitboxCfg.radiusY : 0.24);
      const cavityCy = geom.imgY + geom.h * (hitboxCfg.centerY !== undefined ? hitboxCfg.centerY : 0.58) + (hitboxCfg.offsetY || 0);
      const cavityCx = geom.cx + (hitboxCfg.offsetX || 0);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // Vệt phản xạ ánh bóng cong hình lưỡi liềm bên trái (Curved Specular Crescent)
      const specX = cavityCx - rx * 0.45;
      const specY = cavityCy - ry * 0.35;
      const specR = rx * 0.48;

      const specGrad = ctx.createRadialGradient(specX, specY, 0, specX, specY, specR);
      specGrad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
      specGrad.addColorStop(0.45, 'rgba(224, 242, 254, 0.08)');
      specGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = specGrad;
      ctx.beginPath();
      ctx.ellipse(specX, specY, specR, specR * 0.65, -Math.PI / 5, 0, Math.PI * 2);
      ctx.fill();

      // Viền phản quang mỏng thanh thoát dọc mép kính
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(cavityCx, cavityCy, rx * 0.94, ry * 0.94, 0, 0.72 * Math.PI, 1.10 * Math.PI, false);
      ctx.stroke();

      ctx.restore();
    }

    // 3. Khung dây vật lý hỗ trợ căn chỉnh chuẩn xác theo mọi ảnh mẫu hũ (Debug Hitbox Wireframe)
    function drawDebugHitbox(ctx, geom, points) {
      if (!jarConfig.debugHitbox || !points || points.length < 3) return;

      ctx.save();
      // a. Đường viền lòng hũ (Neon Cyan Dash)
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 3.0;
      ctx.setLineDash([8, 5]);
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();

      // b. Các chốt đỉnh (Amber Dots)
      ctx.setLineDash([]);
      ctx.fillStyle = '#f59e0b';
      for (let i = 0; i < points.length; i++) {
        ctx.beginPath();
        ctx.arc(points[i].x, points[i].y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // c. Tâm lòng hũ & hồng tâm căn chỉnh (Red Crosshair)
      const hitboxCfg = jarConfig.hitbox || {};
      const cavityCy = geom.imgY + geom.h * (hitboxCfg.centerY !== undefined ? hitboxCfg.centerY : 0.58) + (hitboxCfg.offsetY || 0);
      const cavityCx = geom.cx + (hitboxCfg.offsetX || 0);

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.0;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(cavityCx - 22, cavityCy);
      ctx.lineTo(cavityCx + 22, cavityCy);
      ctx.moveTo(cavityCx, cavityCy - 22);
      ctx.lineTo(cavityCx, cavityCy + 22);
      ctx.stroke();

      // d. Bảng thông số đo đạc trực quan
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(cavityCx - 95, cavityCy - 48, 190, 26);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      ctx.strokeRect(cavityCx - 95, cavityCy - 48, 190, 26);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`HITBOX: ${hitboxCfg.shape || 'sphere'} [${points.length} pts]`, cavityCx, cavityCy - 35);

      ctx.restore();
    }

    // Vẽ một hạt quà vật lý (Gift Sprite)
    function drawGiftBody(ctx, b) {
      const { x, y } = b.position;
      const r = b.giftData?.radius || b.circleRadius || 18;
      const angle = b.angle;
      const data = b.giftData || {};

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Đổ bóng nhẹ dưới quà
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 2;

      let img = null;
      if (data.iconUrl) {
        img = preloadImage(data.iconUrl);
      }

      if (img && img.complete && img.naturalWidth > 0) {
        // Cắt hình tròn vẽ ảnh icon TikTok chính thức
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, -r, -r, r * 2, r * 2);

        // Vành viền bóng nhẹ quanh icon
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else {
        // Fallback: Vẽ huy hiệu bo tròn kèm emoji thông minh
        const coins = data.coins || 1;
        let bgGrad = ctx.createLinearGradient(-r, -r, r, r);
        if (coins === 1) {
          bgGrad.addColorStop(0, '#f43f5e'); bgGrad.addColorStop(1, '#e11d48');
        } else if (coins <= 9) {
          bgGrad.addColorStop(0, '#ec4899'); bgGrad.addColorStop(1, '#be185d');
        } else if (coins <= 99) {
          bgGrad.addColorStop(0, '#f59e0b'); bgGrad.addColorStop(1, '#d97706');
        } else if (coins <= 999) {
          bgGrad.addColorStop(0, '#8b5cf6'); bgGrad.addColorStop(1, '#6d28d9');
        } else {
          bgGrad.addColorStop(0, '#ef4444'); bgGrad.addColorStop(1, '#b91c1c');
        }

        ctx.fillStyle = bgGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // Biểu tượng Emoji
        let emoji = '🎁';
        const name = (data.giftName || '').toLowerCase();
        if (name.includes('hồng') || name.includes('rose')) emoji = '🌹';
        else if (name.includes('bánh vòng') || name.includes('donut')) emoji = '🍩';
        else if (name.includes('sư tử') || name.includes('lion')) emoji = '🦁';
        else if (name.includes('vũ trụ') || name.includes('universe')) emoji = '🌌';
        else if (coins === 1) emoji = '🌹';
        else if (coins === 30) emoji = '🍩';

        ctx.font = `${Math.round(r * 1.1)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, 0, 1);
      }

      ctx.restore();
    }

    // ==========================================
    // 8. MAIN ANIMATION LOOP (60FPS OBS RENDERING)
    // ==========================================
    let lastTime = performance.now();

    function renderLoop(time) {
      const dt = Math.min(33, time - lastTime);
      lastTime = time;

      // 1. Cập nhật vật lý Matter.js
      Engine.update(engine, dt);

      // 2. Xoá canvas trong suốt
      ctx.clearRect(0, 0, width, height);

      // 3. Tính toán Trauma rung lắc hũ
      let shakeOffsetX = 0;
      let shakeOffsetY = 0;
      let shakeRot = 0;

      if (jarState.shakeTrauma > 0) {
        jarState.shakeTime += 0.35;
        const trauma2 = jarState.shakeTrauma * jarState.shakeTrauma;
        shakeOffsetX = Math.sin(jarState.shakeTime * 1.4) * 18 * trauma2;
        shakeOffsetY = Math.cos(jarState.shakeTime * 1.7) * 12 * trauma2;
        shakeRot = Math.sin(jarState.shakeTime * 1.2) * 0.05 * trauma2;

        // Giảm dần trauma
        jarState.shakeTrauma = Math.max(0, jarState.shakeTrauma - 0.015);
      }

      ctx.save();
      // Áp dụng rung lắc & lật hũ (Flip)
      const { cx, cy } = jarGeometry;
      ctx.translate(cx + shakeOffsetX, cy + shakeOffsetY);
      ctx.rotate(jarState.flipAngle + shakeRot);
      ctx.translate(-cx, -cy);

      // --- LAYER 0: HÀO QUANG NEON (AURA GLOW) ---
      if (!jarState.isBurst) {
        drawAuraGlow(ctx, jarGeometry);
      }

      // --- LAYER 1: MẶT SAU & THÂN THỦY TINH TRONG SUỐT (BASE BOWL) ---
      if (!jarState.isBurst) {
        drawJarBackground(ctx, jarGeometry, jarConfig.style);
        drawInnerGlassDepth(ctx, jarGeometry);
      }

      // --- LAYER 2: DECOR / STICKERS DƯỚI KÍNH (BEHIND-GLASS) ---
      if (!jarState.isBurst) {
        drawDecorStickers(ctx, jarGeometry, 'behind_glass');
      }

      // --- LAYER 3: CÁC MÓN QUÀ VẬT LÝ ĐANG RƠI VÀ XẾP LỚP BÊN TRONG (CÓ MẶT NẠ LÒNG HŨ CHỐNG LỌT QUÀ) ---
      if (giftBodies.length > 0) {
        ctx.save();
        if (jarConfig.clipGiftsToJar !== false && currentCavityPoints && currentCavityPoints.length > 3) {
          const mouthY = currentCavityPoints[0].y;
          // Mở rộng toàn bộ bầu trời phía trên miệng hũ (-1000 đến width+1000) không bị cắt
          // Khi quà rơi vào trong miệng hũ, được khóa kín khít theo từng tọa độ lòng kính chống lọt
          ctx.beginPath();
          ctx.moveTo(-1000, -1000);
          ctx.lineTo(width + 1000, -1000);
          ctx.lineTo(width + 1000, mouthY);
          ctx.lineTo(currentCavityPoints[0].x, mouthY);
          for (let i = 1; i < currentCavityPoints.length; i++) {
            ctx.lineTo(currentCavityPoints[i].x, currentCavityPoints[i].y);
          }
          ctx.lineTo(-1000, mouthY);
          ctx.closePath();
          ctx.clip();
        }

        giftBodies.forEach(b => drawGiftBody(ctx, b));
        ctx.restore();
      }

      // --- LAYER 4: HIỆU ỨNG PHẢN CHIẾU ÁNH BÓNG MẶT KÍNH TRƯỚC (QUÉT LÊN TRÊN QUÀ) ---
      if (!jarState.isBurst) {
        drawGlassFrontReflection(ctx, jarGeometry);
      }

      // --- LAYER 5: MẶT TRƯỚC PHẢN CHIẾU ÁNH SÁNG, NƠ, CỔ BÈO & BÓNG KÍNH (FOREGROUND OVERLAY) ---
      if (!jarState.isBurst) {
        drawJarForegroundHighlights(ctx, jarGeometry, jarConfig.style);
      }

      // --- LAYER 6: DECOR & STICKERS MẶT TRƯỚC HŨ ---
      if (!jarState.isBurst) {
        drawDecorStickers(ctx, jarGeometry, 'front');
      }

      // --- LAYER 7: HIỆU ỨNG DẢI SÁNG LẤP LÁNH CHẠY QUANH VIỀN HŨ (60FPS CAUSTIC SHIMMER & SPARKLES) ---
      if (!jarState.isBurst) {
        drawRealisticRimShimmer(ctx, jarGeometry, time);
      }

      // --- LAYER 8: CÁC ĐƯỜNG NỨT THỦY TINH (CRACKS) ---
      if (!jarState.isBurst && jarState.crackLevel > 0) {
        drawCracks(ctx, jarGeometry.cx, jarGeometry.cy, jarGeometry.w, jarGeometry.h, jarState.crackLevel);
      }

      // --- LAYER 9: KHUNG DÂY VẬT LÝ CĂN CHỈNH (DEBUG HITBOX WIREFRAME) ---
      if (!jarState.isBurst && jarConfig.debugHitbox) {
        drawDebugHitbox(ctx, jarGeometry, currentCavityPoints);
      }

      ctx.restore();

      // --- LAYER 6: CÁC MẢNH KÍNH VỠ VÀ PHÁO HOA KHI NỔ TUNG ---
      if (glassShards.length > 0) {
        ctx.save();
        for (let i = glassShards.length - 1; i >= 0; i--) {
          const s = glassShards[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.35; // trọng lực rơi
          s.rot += s.vrot;
          s.alpha -= 0.005;

          if (s.alpha <= 0 || s.y > height + 50) {
            glassShards.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          ctx.fillStyle = `rgba(224, 242, 254, ${s.alpha * 0.75})`;
          ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha * 0.95})`;
          ctx.lineWidth = 1.5;

          ctx.beginPath();
          ctx.moveTo(s.points[0].x, s.points[0].y);
          for (let p = 1; p < s.points.length; p++) {
            ctx.lineTo(s.points[p].x, s.points[p].y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

      // Pháo hoa giấy bay
      if (confettiParticles.length > 0) {
        ctx.save();
        for (let i = confettiParticles.length - 1; i >= 0; i--) {
          const p = confettiParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.28;
          p.rot += p.vrot;
          p.alpha -= 0.006;

          if (p.alpha <= 0 || p.y > height + 50) {
            confettiParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        ctx.restore();
      }

      // --- LAYER 7: BỤI SÁNG LẤP LÁNH KHI QUÀ RƠI (SPARKLE DUST) ---
      if (sparkleParticles.length > 0) {
        ctx.save();
        for (let i = sparkleParticles.length - 1; i >= 0; i--) {
          const sp = sparkleParticles[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.alpha -= sp.decay;

          if (sp.alpha <= 0) {
            sparkleParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = sp.alpha;
          ctx.fillStyle = sp.color;
          ctx.shadowColor = sp.color;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // ==========================================
    // 9. KẾT NỐI WEBSOCKET NHẬN SỰ KIỆN TỪ SERVER
    // ==========================================
    const socket = io({
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 3000,
      timeout: 20000,
      transports: ['websocket', 'polling']
    });

    let lastDisconnectTime = null;

    socket.on('connect', () => {
      console.log('⚡ [JAR] Đã kết nối Socket.IO thành công!');
      lastDisconnectTime = null;
      // Yêu cầu nạp cấu hình hũ mới nhất
      fetch('/api/jar/config')
        .then(r => r.json())
        .then(res => {
          if (res.success && res.config) {
            jarConfig = { ...jarConfig, ...res.config };
            AudioEngine.enabled = jarConfig.soundEnabled !== false;
            AudioEngine.volume = jarConfig.soundVolume || 0.7;
            updateGoal(0, false);
          }
        }).catch(() => {});
    });

    socket.on('disconnect', () => {
      console.warn('⚠️ [JAR] Mất kết nối tới Server. Đang chờ kết nối lại...');
      lastDisconnectTime = Date.now();
    });

    // Watchdog Ping cho OBS Browser Source: Tự động tải lại trang khi server khởi động lại
    setInterval(() => {
      if (!socket.connected) {
        fetch('/api/ping', { cache: 'no-store' })
          .then(res => {
            if (res.ok) {
              if (lastDisconnectTime && (Date.now() - lastDisconnectTime > 3000)) {
                console.log('🔄 [JAR] Server đã trực tuyến trở lại! Tự động làm mới trang...');
                window.location.reload();
              } else if (!socket.connected) {
                socket.connect();
              }
            }
          })
          .catch(() => {});
      }
    }, 2500);

    // Nhận quà rơi vào hũ
    socket.on('jar_drop_gift', (data) => {
      console.log('🎁 [JAR DROP]', data);
      dropGift(data);
    });

    // Nhận hành động tương tác (Lắc, Nứt, Lật, Nổ, Dọn)
    socket.on('jar_action', (data) => {
      console.log('⚡ [JAR ACTION]', data);
      triggerAction(data);
    });

    // Cập nhật cấu hình
    socket.on('jar_config_updated', (newCfg) => {
      jarConfig = { ...jarConfig, ...newCfg };
      AudioEngine.enabled = jarConfig.soundEnabled !== false;
      AudioEngine.volume = jarConfig.soundVolume || 0.7;
      engine.world.gravity.y = (Number(jarConfig.gravity) || 1.0) * (Number(jarConfig.fallSpeed) || 1.0);
      updateGoal(0, false);
      rebuildJarBodies();
      rebuildScreenBoundaries();
      resizeActiveGiftBodies();
    });

    // Kích hoạt âm thanh khi người dùng click vào trang
    window.addEventListener('click', () => AudioEngine.ensureCtx());
  </script>
</body>
