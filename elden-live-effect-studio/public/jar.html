<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nguồn OBS hũ quà · Elden Media Studio</title>
  <link rel="icon" href="/brand/elden-media.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important; /* OBS Browser Source transparent */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #stage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    canvas#physics-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD: MỤC TIÊU & TÍCH LUỸ XU */
    #goal-hud {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .goal-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(251, 191, 36, 0.25);
      border-radius: 999px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    .goal-icon {
      font-size: 1.4rem;
      animation: floatIcon 2s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .goal-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f1f5f9;
      text-transform: uppercase;
    }
    .goal-counter {
      font-size: 1.05rem;
      font-weight: 900;
      color: #fbbf24;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }
    .goal-bar-wrap {
      width: 280px;
      height: 8px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .goal-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #10b981);
      box-shadow: 0 0 8px #fbbf24;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #celebration-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #celebration-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .banner-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      padding: 12px 36px;
      border-radius: 999px;
      box-shadow: 0 10px 40px rgba(245, 158, 11, 0.6), 0 0 20px #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      border: 3px solid #fff;
    }
    #stage-container[hidden] { display: none; }
    #goal-hud { top: clamp(16px, 4vh, 48px); max-width: calc(100% - 24px); }
    @media (prefers-reduced-motion: reduce) {
      #celebration-banner { animation: none; transition: none; }
    }
  </style>

  <!-- Nạp thư viện Matter.js chuẩn offline & Socket.io -->
  <script src="/vendor/matter.min.js"></script>
  <script src="/jar-geometry.js"></script>
  <script src="/jar-glass-effects.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="stage-container" hidden>
    <canvas id="physics-canvas"></canvas>

    <!-- MỤC TIÊU TIẾN TRÌNH HŨ -->
    <div id="goal-hud">
      <div class="goal-pill">
        <span class="goal-icon">🏺</span>
        <div>
          <span class="goal-title" id="hudGoalTitle">Mục Tiêu Đầy Hũ</span>
          <span style="margin: 0 6px; opacity: 0.5;">|</span>
          <span class="goal-counter" id="hudGoalCounter">0 / 500 Xu</span>
        </div>
      </div>
      <div class="goal-bar-wrap">
        <div class="goal-bar-fill" id="hudGoalFill"></div>
      </div>
    </div>

    <!-- BANNER NỔ HŨ HOÀN THÀNH MỤC TIÊU -->
    <div id="celebration-banner">
      <div class="banner-badge">Đã đạt mục tiêu!</div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. WEB AUDIO API - TỔNG HỢP ÂM THANH CHÂN THỰC (ZERO DEPENDENCIES)
    // ==========================================
    const AudioEngine = {
      ctx: null,
      enabled: true,
      volume: 0.7,

      init() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        } catch (_) {}
      },

      ensureCtx() {
        if (!this.ctx) this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },

      // Tiếng va chạm lách cách kính trong trẻo khi quà rơi vào hũ
      playClink(pitch = 1.0) {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          const baseFreq = 1800 * pitch + (Math.random() * 400 - 200);
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + 0.12);

          gain.gain.setValueAtTime(0.25 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.13);
        } catch (_) {}
      },

      // Tiếng kính nứt rắc rắc sắc bén
      playCrack() {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.15;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(2500, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.6 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
        } catch (_) {}
      },

      playShatter() {
        if (!this.enabled || this.volume <= 0) return;
        this.ensureCtx();
        if (!this.ctx) return;

        const { ctx } = this;
        try {
          const duration = 0.34;
          const buffer = ctx.createBuffer(1, Math.round(ctx.sampleRate * duration), ctx.sampleRate);
          const samples = buffer.getChannelData(0);
          for (let i = 0; i < samples.length; i++) {
            const time = i / ctx.sampleRate;
            const firstSnap = Math.exp(-time / 0.024);
            const fallingGlass = time > 0.045 ? Math.exp(-(time - 0.045) / 0.074) * 0.38 : 0;
            samples[i] = (Math.random() * 2 - 1) * (firstSnap + fallingGlass);
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 1900;
          const gain = ctx.createGain();
          gain.gain.value = 0.63 * this.volume;
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start();
        } catch (_) {}
      },

      // Hợp âm chúc mừng Fanfare (C5, E5, G5, C6)
      playFanfare() {
        if (!this.enabled) return;
        this.ensureCtx();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          try {
            const now = this.ctx.currentTime + idx * 0.12;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.35 * this.volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.65);
          } catch (_) {}
        });
      }
    };

    // ==========================================
    // 2. KHỞI TẠO MATTER.JS & CẤU HÌNH HŨ
    // ==========================================
    const { Engine, World, Bodies, Body, Composite, Vector, Events } = Matter;

    const canvas = document.getElementById('physics-canvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      rebuildScreenBoundaries();
      rebuildJarBodies();
    });

    const engine = Engine.create({
      enableSleeping: true, positionIterations: 8
    });
    engine.world.gravity.y = 1.0;

    // Cấu hình hũ mặc định
    let jarConfig = {
      enabled: true,
      style: 'fishbowl',
      customJarImage: '/builtin/jar/iridescent_fishbowl_transparent.png',
      frontOverlayImage: '/builtin/jar/iridescent_fishbowl_front_overlay.png',
      hideDefaultJarOnCustom: true,
      decorImage: '',
      decorText: '',
      decorPosition: 'bottom',
      decorScale: 0.85,
      decorOpacity: 0.98,
      jarPosX: 50,
      jarPosY: 78,
      jarScale: 1.0,
      dropOrigin: 'top',
      dropMode: 'straight', // 'straight' | 'shower'
      dropSpread: 0.16,
      fallSpeed: 0.65,
      gravity: 1.05,
      shakeThreshold: 1000,
      flipSpeed: 1,
      enableFloorAccumulation: true,
      giftCapacity: 400,
      giftCapacityUnlimited: false,
      giftScaleGlobal: 0.85,
      giftSizeSmall: 16,
      giftSizeMedium: 26,
      giftSizeLarge: 38,
      giftSizeVIP: 54,
      glowEffect: true,
      sparkleEffect: true,
      shimmerRimEffect: true,
      shimmerRimSpeed: 1.0,
      shimmerSparkles: true,
      goalEnabled: false,
      goalTargetCoins: 500,
      currentCoins: 0,
      bounciness: 0.20,
      soundEnabled: true,
      soundVolume: 0.3,
      autoBurstOnGoal: false,
      jarAspect: 'square',
      debugHitbox: false,
      clipGiftsToJar: true,
      glassRealism: true,
      hitbox: {
        shape: 'sphere', // 'sphere' | 'bottle' | 'cylinder'
        radiusX: 0.31,
        radiusY: 0.24,
        centerY: 0.58,
        mouthY: 0.12,
        neckWidth: 0.38,
        neckHeight: 0.36,
        offsetX: 0,
        offsetY: 0,
        scaleX: 1.0,
        scaleY: 1.0
      },
      jarPadding: {
        top: 0,
        bottom: 0,
        left: 0,
        right: 0
      },
      stickers: []
    };

    // Trạng thái tương tác
    let jarState = {
      currentCoins: 0,
      crackLevel: 0,
      goalCrackLevel: 0,
      goalBurstUsed: false,
      isBurst: false,
      isFlipped: false
    };

    // Bộ nhớ cache ảnh để vẽ sprite mượt mà 60fps
    const imageCache = {};
    function preloadImage(url) {
      if (!url) return null;
      if (imageCache[url]) return imageCache[url];
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = url;
      imageCache[url] = img;
      return img;
    }

    const restPose = { x: 0, y: 0, angle: 0 };
    let jarPose = restPose;
    let wallRest = [];
    const crackStarts = [];
    let jarArtwork;
    let glassShards = [];
    let sparkleParticles = [];

    function spawnSparkleDust(x, y, coins) {
      const num = coins >= 100 ? 10 : 4;
      const colors = ['#fef08a', '#facc15', '#38bdf8', '#ffffff'];
      for (let i = 0; i < num; i++) {
        sparkleParticles.push({
          x: x + (Math.random() - 0.5) * 24,
          y: y + (Math.random() - 0.5) * 24,
          vx: (Math.random() - 0.5) * 2.2,
          vy: - (0.5 + Math.random() * 2),
          size: 2 + Math.random() * 3.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1.0,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    // ==========================================
    // 3. XÂY DỰNG HÌNH HỌC VẬT LÝ CỦA HŨ (COLLISION WALLS)
    // ==========================================
    let jarWalls = [];
    let jarGeometry = {
      cx: 0,
      cy: 0,
      w: 360,
      h: 490,
      neckW: 240,
      neckH: 60,
      wallThickness: 22
    };

    function calculateJarGeometry() {
      const scale = jarConfig.jarScale || 1.0;
      const posX = typeof jarConfig.jarPosX === 'number' ? jarConfig.jarPosX : 50;
      const posY = typeof jarConfig.jarPosY === 'number' ? jarConfig.jarPosY : 78;
      const aspect = jarConfig.jarAspect || 'square';
      const isFishbowl = aspect === 'square';

      let baseW, baseH, neckW, neckH;
      if (isFishbowl) {
        // BỂ CẦU TRÒN PHA LÊ (Square 1:1)
        const minDim = Math.min(width * 0.88, height * 0.60);
        baseW = minDim;
        baseH = minDim;
        neckW = baseW * 0.44 * scale;
        neckH = baseH * 0.18 * scale;
      } else if (aspect === 'horizontal') {
        baseW = Math.min(560, width * 0.85, height * 0.6);
        baseH = baseW * 0.75;
        neckW = baseW * 0.78 * scale;
        neckH = 42 * scale;
      } else {
        baseW = Math.min(380, width * 0.75, height * 0.42);
        baseH = baseW * 4 / 3;
        neckW = baseW * 0.68 * scale;
        neckH = 55 * scale;
      }

      const w = baseW * scale;
      const h = baseH * scale;
      const wallThickness = Math.max(4, w * 0.044);

      // Tâm (cx, cy) chuẩn xác theo % vị trí
      const fitX = Math.min(width / 2, w / 2 + 8);
      const fitY = Math.min(height / 2, h / 2 + 8);
      const cx = Math.max(fitX, Math.min(width - fitX, width * posX / 100));
      const cy = Math.max(fitY, Math.min(height - fitY, height * posY / 100));

      const imgW = w;
      const imgH = h;
      const imgX = cx - w / 2;
      const imgY = cy - h / 2;

      const hitboxCfg = jarConfig.hitbox || {};
      const rx = w * (hitboxCfg.radiusX ?? 0.315) * (hitboxCfg.scaleX ?? 1);
      const ry = h * (hitboxCfg.radiusY ?? 0.24) * (hitboxCfg.scaleY ?? 1);
      const cavityCy = imgY + h * (hitboxCfg.centerY !== undefined ? hitboxCfg.centerY : 0.58) + (hitboxCfg.offsetY || 0);
      const cavityCx = cx + (hitboxCfg.offsetX || 0);
      const mouthY = imgY + h * (hitboxCfg.mouthY !== undefined ? hitboxCfg.mouthY : 0.12);
      const mouthW = w * (hitboxCfg.neckWidth !== undefined ? hitboxCfg.neckWidth : 0.38);

      jarGeometry = {
        cx,
        cy,
        w,
        h,
        imgX,
        imgY,
        imgW,
        imgH,
        neckW: mouthW,
        neckH,
        wallThickness,
        aspect,
        isFishbowl,
        bowlCx: cavityCx,
        bowlCy: cavityCy,
        bowlRx: rx,
        bowlRy: ry,
        bowlR: rx,
        mouthY,
        mouthW
      };
    }

    const giftCategory = 0x0001;
    const screenBoundaryCategory = 0x0002;
    const jarWallCategory = 0x0004;
    let screenBoundaries = [];

    function giftCollisionMask(retainedAfterBreak) {
      return jarConfig.enableFloorAccumulation !== false || retainedAfterBreak ? 0xffffffff : 0xffffffff ^ screenBoundaryCategory;
    }

    function updateGiftCollisionMask(body) {
      let mask = giftCollisionMask(body.giftData.retainedAfterBreak);
      if (flipAnimation?.spilled.has(body)) mask &= ~(jarWallCategory | giftCategory);
      body.collisionFilter.mask = mask;
    }

    function rebuildScreenBoundaries() {
      World.remove(engine.world, screenBoundaries);
      // Gifts spilled by a broken jar stay on the floor even if ordinary overflow is disabled.
      const boundary = (x, y, w, h, friction, label) => Bodies.rectangle(x, y, w, h, {
        isStatic: true, friction, restitution: 0.15, label,
        collisionFilter: { category: screenBoundaryCategory }
      });
      screenBoundaries = [
        boundary(width / 2, height + 150, width * 4, 300, 0.85, 'screen_floor'),
        boundary(-100, height / 2, 200, height * 4, 0.2, 'screen_wall'),
        boundary(width + 100, height / 2, 200, height * 4, 0.2, 'screen_wall')
      ];
      World.add(engine.world, screenBoundaries);
    }

    // Lưu trữ đỉnh của lòng hũ cho clipping và debug hitbox
    let currentCavityPoints = [];

    let lastJarGeometry = null;

    function rebuildJarBodies() {
      if (jarState.isFlipped) return;
      // Xoá các tường cũ nếu có
      if (jarWalls.length > 0) {
        World.remove(engine.world, jarWalls);
        jarWalls = [];
      }

      calculateJarGeometry();
      if (jarState.isBurst) return;

      const oldGeom = lastJarGeometry;
      const oldPoints = currentCavityPoints;
      lastJarGeometry = { ...jarGeometry };

      const hitboxCfg = jarConfig.hitbox || {};
      const bounciness = Math.max(0, Math.min(0.8, Number(jarConfig.bounciness ?? 0.2)));
      const wallThickness = jarGeometry.wallThickness;

      currentCavityPoints = getCavityPoints(jarGeometry, hitboxCfg);

      jarWalls = makeCavityWalls(currentCavityPoints, wallThickness, bounciness);
      for (const wall of jarWalls) wall.collisionFilter.category = jarWallCategory;
      wallRest = jarWalls.map(body => ({ body, x: body.position.x, y: body.position.y, angle: body.angle }));
      World.add(engine.world, jarWalls);
      placeJar(jarPose, false);

      // --- TỰ ĐỘNG KÉO THEO TOÀN BỘ QUÀ HIỆN CÓ KHI DỊCH CHUYỂN HOẶC CO GIÃN HŨ ---
      if (oldGeom && oldGeom.w > 0 && giftBodies.length > 0) {
        const oldCavityCx = oldGeom.bowlCx || oldGeom.cx;
        const oldCavityCy = oldGeom.bowlCy || oldGeom.cy;
        const newCavityCx = jarGeometry.bowlCx || jarGeometry.cx;
        const newCavityCy = jarGeometry.bowlCy || jarGeometry.cy;

        const dx = newCavityCx - oldCavityCx;
        const dy = newCavityCy - oldCavityCy;
        const scaleRatio = jarGeometry.w / oldGeom.w;

        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 || Math.abs(scaleRatio - 1.0) > 0.005) {
          giftBodies.forEach(b => {
            if (!isInsideCavity(b.position, oldPoints)) return;
            // Co giãn vị trí tương đối quanh tâm lòng hũ
            const relX = (b.position.x - oldCavityCx) * scaleRatio;
            const relY = (b.position.y - oldCavityCy) * scaleRatio;
            const targetX = newCavityCx + relX;
            const targetY = newCavityCy + relY;

            Body.setPosition(b, { x: targetX, y: targetY });
            Body.setVelocity(b, { x: (Math.random() - 0.5) * 0.2, y: 0.5 });
            Matter.Sleeping.set(b, false);
            b.isSleeping = false;
          });
        }
      }
    }

    // ==========================================
    // 4. QUẢN LÝ QUÀ TẶNG & THẢ QUÀ VẬT LÝ (GIFT PHYSICS BODY)
    // ==========================================
    let giftBodies = [];
    const airborneGifts = new Set();
    let jarHiddenAt;
    const pendingDrops = [];
    const giftInventory = new Map();
    let inventoryDirty = true;
    let nextDropAt = 0;
    let queuedGiftCount = 0;
    let jarSessionId;
    let jarSyncPending = true;
    let jarEventSequence = 0;
    let restoredGiftBatches = [];
    let restoredPositions = [];
    let restoreGrid;
    let checkpointDirty = true;
    let goalBurstTimer;
    let assembly;
    let flipAnimation;
    let settlingPour;
    let shakeAnimation;
    let pendingBreak;
    let bannerTimer;
    const previewMode = new URLSearchParams(location.search).has('preview');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');


    rebuildScreenBoundaries();
    rebuildJarBodies();

    Events.on(engine, 'collisionStart', ({ pairs }) => {
      const contact = pairs.find(({ bodyA, bodyB }) =>
        (bodyA.label === 'gift_item' && bodyB.label === 'jar_wall' && bodyA.speed > 3) ||
        (bodyB.label === 'gift_item' && bodyA.label === 'jar_wall' && bodyB.speed > 3)
      );
      if (contact && performance.now() - lastClink > 105) {
        lastClink = performance.now();
        AudioEngine.playClink();
      }
    });
    let lastClink = -Infinity;
    // Tính bán kính hiển thị và va chạm theo xu & cài đặt kích thước
    function getGiftRadius(coins) {
      const global = Number(jarConfig.giftScaleGlobal) || 1.0;
      const numCoins = Number(coins) || 1;
      let baseR = 15;
      if (numCoins <= 9) {
        baseR = Number(jarConfig.giftSizeSmall) || 12;
      } else if (numCoins <= 99) {
        baseR = Number(jarConfig.giftSizeMedium) || 22;
      } else if (numCoins <= 999) {
        baseR = Number(jarConfig.giftSizeLarge) || 32;
      } else {
        baseR = Number(jarConfig.giftSizeVIP) || 48;
      }
      return Math.max(5, Math.round(baseR * global));
    }

    function resizeActiveGiftBodies() {
      const { mouthY, bowlCx, bowlCy, bowlRy } = jarGeometry;
      for (const body of giftBodies) {
        const previous = body.giftData.radius;
        const radius = getGiftRadius(body.giftData.coins);
        if (radius === previous) continue;
        const ratio = radius / previous;
        Body.scale(body, ratio, ratio);
        body.giftData.radius = radius;
        body.circleRadius = radius;
        const { x, y } = body.position;
        if (!jarState.isBurst && jarPose === restPose && ratio < 1 && isInsideCavity(body.position, currentCavityPoints)) {
          const floor = bowlCy + bowlRy - jarGeometry.wallThickness / 2 - radius;
          Body.setPosition(body, {
            x: bowlCx + (x - bowlCx) * ratio,
            y: Math.max(mouthY + radius, floor - (floor - y) * ratio)
          });
        } else if (jarConfig.enableFloorAccumulation !== false && y > height - radius) {
          Body.setPosition(body, { x, y: height - radius });
        }
        Matter.Sleeping.set(body, false);
      }
    }

    function limitGiftBodies(room = 0) {
      if (jarConfig.giftCapacityUnlimited === true) return;
      const capacity = Math.max(1, Math.floor(Number(jarConfig.giftCapacity) || 600));
      while (giftBodies.length > capacity - room) {
        const body = giftBodies.shift();
        if (!airborneGifts.delete(body)) World.remove(engine.world, body);
        adjustGiftInventory(body.giftData, -1, 0);
      }
    }

    function adjustGiftInventory({ key, inventoryName }, count, queued) {
      const item = giftInventory.get(key) || { key, name: inventoryName, count: 0, queued: 0 };
      item.count += count;
      item.queued += queued;
      if (item.count || item.queued) giftInventory.set(key, item);
      else giftInventory.delete(key);
      inventoryDirty = true;
    }

    function createJarGift(data, x, y, radius, retainedAfterBreak, angle = 0, arrival = null) {
      const body = Bodies.circle(x, y, radius, {
        restitution: Math.max(0, Math.min(0.8, Number(jarConfig.bounciness ?? 0.2))),
        friction: 0.25,
        frictionAir: 0.012,
        angle,
        label: 'gift_item',
        collisionFilter: { category: giftCategory, mask: giftCollisionMask(retainedAfterBreak) }
      });
      body.giftData = { ...data, radius, retainedAfterBreak, arrival };
      if (arrival) airborneGifts.add(body);
      else World.add(engine.world, body);
      giftBodies.push(body);
      checkpointDirty = true;
      return body;
    }

    function normalizeJarGift(data) {
      const count = Math.max(1, Math.floor(Number(data.count) || 1));
      if (!Number.isSafeInteger(count)) return;
      const coins = Math.max(1, Math.floor(Number(data.diamondCount ?? data.coins) || 1));
      const inventoryName = String(data.inventoryName || data.giftName || 'Quà tặng').trim().slice(0, 160) || 'Quà tặng';
      const id = String(data.giftId ?? '').trim().slice(0, 180);
      const key = data.giftKey || (id && id !== 'custom' ? 'id:' + id : 'name:' + inventoryName.normalize('NFC').toLocaleLowerCase('vi'));
      const jarAction = data.giftKey ? data.jarAction : jarConfig.giftActions?.[key]?.action;
      return { ...data, count, coins, key, inventoryName, jarAction };
    }

    function dropGift(data) {
      if (!data) return;
      const gift = normalizeJarGift(data);
      if (!gift) return;
      if (gift.jarAction) triggerAction({ action: gift.jarAction });
      if (gift.iconUrl) preloadImage(gift.iconUrl);
      if (!pendingDrops.length) nextDropAt = 0;
      pendingDrops.push({ data: gift, total: gift.coins * gift.count, remaining: gift.count, started: false });
      queuedGiftCount += gift.count;
      adjustGiftInventory(gift, 0, gift.count);
    }

    function spawnPendingGifts(now) {
      if (!pendingDrops.length || jarState.isFlipped || pendingBreak || assembly) return;
      const shower = jarConfig.dropMode === 'shower';
      const fallSpeed = Math.max(0.5, Math.min(2.5, Number(jarConfig.fallSpeed) || 1));
      if (!nextDropAt) nextDropAt = now;

      for (let spawned = 0; spawned < 6 && pendingDrops.length && now >= nextDropAt; spawned++) {
        const batch = pendingDrops[0];
        const { data } = batch;
        const { mouthY, bowlCx, neckW } = jarGeometry;
        const radius = getGiftRadius(data.coins);
        const origin = jarConfig.dropOrigin;
        const spawnY = origin === 'mouth' ? mouthY - radius - 12 :
          origin === 'middle' ? Math.min(mouthY - radius - 12, height * 0.35) : -radius - 3;
        const spread = shower ? neckW * Number(jarConfig.dropSpread ?? 0.35) : 10;
        const x = bowlCx + (Math.random() - 0.5) * spread;
        const entryY = mouthY - radius - 16;
        const distance = entryY - spawnY;
        const pace = Math.sqrt(fallSpeed * (Number(jarConfig.gravity) || 1));
        const arrival = distance > 0 ? {
          x, y: spawnY, distance, start: now,
          duration: Math.max(100, 1100 * Math.sqrt(distance / height) / pace),
          spin: (Math.random() - 0.5) * 3.5
        } : null;

        limitGiftBodies(1);
        const body = createJarGift(data, x, spawnY, radius, jarState.isBurst, 0, arrival);
        if (!arrival) {
          Body.setVelocity(body, { x: (bowlCx - x) * 0.018, y: 3 * Math.sqrt(fallSpeed) });
          Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.09);
        }
        queuedGiftCount--;
        adjustGiftInventory(body.giftData, 1, -1);

        if (!batch.started) {
          batch.started = true;
          updateGoal(batch.total);
          const threshold = Number(jarConfig.shakeThreshold ?? 50);
          const shakeCoins = data.autoShakeCoins ?? batch.total;
          if (!data.jarAction && threshold > 0 && shakeCoins >= threshold) {
            triggerAction({ action: 'shake', intensity: Math.min(1.5, shakeCoins / threshold) });
          }
        }
        if (jarConfig.sparkleEffect !== false && batch.remaining % 3 === 1 && !reducedMotion.matches && queuedGiftCount < 30) {
          spawnSparkleDust(x, Math.max(0, spawnY), data.coins);
        }
        if (--batch.remaining === 0) pendingDrops.shift();
        const gap = Math.max(12, (shower ? 23 : 35) / Math.sqrt(fallSpeed) / (queuedGiftCount >= 25 ? 1.5 : 1));
        nextDropAt = Math.max(nextDropAt + gap, now - gap * 3);
        if (jarState.isFlipped || pendingBreak || assembly) break;
      }
    }

    function advanceAirborneGifts(now) {
      for (const body of airborneGifts) {
        const flight = body.giftData.arrival;
        const progress = Math.max(0, Math.min(1, (now - flight.start) / flight.duration));
        // Keep the approach smooth under load. Matter takes over near the mouth for real collisions.
        const traveled = progress * (0.42 + 0.58 * progress);
        Body.setPosition(body, { x: flight.x, y: flight.y + flight.distance * traveled });
        Body.setAngle(body, flight.spin * progress);

        if (progress >= 1) {
          airborneGifts.delete(body);
          body.giftData.arrival = null;
          World.add(engine.world, body);
          const velocity = flight.distance / flight.duration * (1000 / 60) * 1.58;
          Body.setVelocity(body, { x: (jarGeometry.bowlCx - flight.x) * .018, y: Math.min(13, velocity) });
          Body.setAngularVelocity(body, flight.spin * .025);
        }
      }
    }

    // ==========================================
    // 5. HIỆU ỨNG TƯƠNG TÁC (SHAKE, CRACK, FLIP, BURST, CLEAR)
    // ==========================================
    function triggerAction(payload) {
      const action = payload.action;
      if (!jarConfig.enabled && !['clear', 'remove_gift_type', 'reset'].includes(action)) return;
      if ((jarState.isFlipped || jarState.isBurst || pendingBreak) && ['shake', 'crack', 'flip', 'burst'].includes(action)) return;
      const intensity = Math.max(0.1, Math.min(2, Number(payload.intensity) || 1));

      switch (action) {
        case 'shake':
          shakeJar(intensity);
          break;
        case 'crack':
          setCrackLevel(jarState.crackLevel + 1);
          break;

        case 'flip':
          // 3. Lật hũ (Xả toàn bộ quà dốc ngược 180 độ)
          flipJarAndDump();
          break;

        case 'burst':
          // 4. Nổ tung / Vỡ hũ tan tành
          burstJarExplode();
          break;

        case 'assemble':
          assembleJar();
          break;

        case 'clear_shards':
          glassShards = [];
          if (assembly) assembly.pieces.length = 0;
          break;

        case 'clear':
          // 5. Dọn sạch quà
          clearAllGifts();
          break;

        case 'remove_gift_type':
          removeGiftType(payload.giftKey);
          break;

        case 'reset':
          // 6. Reset mục tiêu và vết nứt
          resetJarGoal();
          break;
      }
    }

    function jarPoint(point, pose = jarPose, inverse = false) {
      const { cx, cy } = jarGeometry;
      const sin = Math.sin(pose.angle);
      const cos = Math.cos(pose.angle);
      if (inverse) {
        const dx = point.x - cx - pose.x;
        const dy = point.y - cy - pose.y;
        return { x: cx + dx * cos + dy * sin, y: cy - dx * sin + dy * cos };
      }
      const dx = point.x - cx;
      const dy = point.y - cy;
      return { x: cx + pose.x + dx * cos - dy * sin, y: cy + pose.y + dx * sin + dy * cos };
    }

    function placeJar(pose, moving = true) {
      jarPose = pose;
      for (const wall of wallRest) {
        Body.setPosition(wall.body, jarPoint(wall), moving);
        Body.setAngle(wall.body, wall.angle + pose.angle, moving);
        if (!moving) {
          Body.setVelocity(wall.body, { x: 0, y: 0 });
          Body.setAngularVelocity(wall.body, 0);
        }
      }
    }

    function wakeJarGifts() {
      const inside = new Set();
      for (const body of giftBodies) {
        if (!isInsideCavity(jarPoint(body.position, jarPose, true), currentCavityPoints)) continue;
        Matter.Sleeping.set(body, false);
        inside.add(body);
      }
      return inside;
    }

    function mixPose(a, b, t) {
      const ease = t * t * (3 - 2 * t);
      return { x: a.x + (b.x - a.x) * ease, y: a.y + (b.y - a.y) * ease,
        angle: a.angle + (b.angle - a.angle) * ease };
    }

    function shakeJar(intensity) {
      const calm = reducedMotion.matches;
      const distance = Math.min(jarGeometry.w * .075, 28) * Math.min(1.4, intensity) * (calm ? .34 : 1);
      shakeAnimation = { start: performance.now(), from: jarPose, distance, duration: calm ? 430 : 780 };
      wakeJarGifts();
    }

    function flipJarAndDump() {
      jarState.isFlipped = true;
      shakeAnimation = undefined;
      const { cx, cy, w } = jarGeometry;
      const calm = reducedMotion.matches;
      const direction = cx > width * .56 ? -1 : 1;
      const raised = { x: (width / 2 - cx) * (calm ? .5 : 1), y: (height * .47 - cy) * (calm ? .58 : 1), angle: 0 };
      const tilted = {
        x: raised.x + direction * Math.min(w * .12, 27) * (calm ? .3 : 1),
        y: raised.y + Math.min(w * .065, 18),
        angle: direction * Math.PI
      };
      const speed = Number.isFinite(jarConfig.flipSpeed) ? Math.max(0.5, Math.min(2, jarConfig.flipSpeed)) : 1;
      const liftEnd = 640;
      flipAnimation = {
        start: performance.now(), from: jarPose, raised, tilted, carried: wakeJarGifts(),
        liftEnd, tipEnd: liftEnd + 590 / speed, spilled: new Set()
      };
    }

    function guideGiftPastRestingJar(body, motion) {
      const { x, y } = body.position;
      const radius = body.giftData.radius;
      const margin = radius + jarGeometry.wallThickness / 2 + 8;
      const left = motion.restBounds.left - margin;
      const right = motion.restBounds.right + margin;
      if (y >= motion.restBounds.bottom + margin || x <= left || x >= right) return false;

      // Select a clear side from the outlet so the descending jar can't catch its own spill.
      const roomLeft = left >= radius;
      const roomRight = right <= width - radius;
      if (!roomLeft && !roomRight) return false;
      const direction = roomLeft && (!roomRight || motion.mouth.x - left < right - motion.mouth.x) ? -1 : 1;
      Matter.Sleeping.set(body, false);
      // A small outward step keeps the spill moving even when floor friction absorbs its velocity.
      Body.setPosition(body, { x: x + direction, y });
      Body.setVelocity(body, { x: direction * (5.5 + (body.id % 7) * .35), y: body.velocity.y });
      return true;
    }

    function pourJarGifts(motion, time) {
      if (!motion.draining) {
        placeJar(motion.tilted, false);
        motion.mouth = jarPoint({ x: jarGeometry.bowlCx, y: jarGeometry.mouthY });
        motion.restBounds = {
          left: Math.min(...currentCavityPoints.map(point => point.x)),
          right: Math.max(...currentCavityPoints.map(point => point.x)),
          bottom: Math.max(...currentCavityPoints.map(point => point.y))
        };
        motion.pourStartedAt = time;
        motion.draining = wakeJarGifts();
        for (const body of motion.carried) {
          const local = jarPoint(body.position, jarPose, true);
          const radius = body.giftData.radius;
          const touchesOpening = Math.abs(local.y - jarGeometry.mouthY) < radius &&
            Math.abs(local.x - jarGeometry.bowlCx) < jarGeometry.mouthW / 2 + radius;
          if (touchesOpening) motion.draining.add(body);
        }
        motion.spilled = new Set([...motion.carried, ...motion.draining]);
        for (const body of motion.spilled) updateGiftCollisionMask(body);
      }

      const { mouth, draining } = motion;
      let stillPouring = false;
      for (const body of giftBodies) {
        if (!motion.spilled.has(body)) continue;
        const radius = body.giftData.radius;
        const clearY = Math.min(height - radius - 2, mouth.y + radius + jarGeometry.wallThickness / 2 + 20);
        if (!draining.has(body) || body.position.y >= clearY) {
          draining.delete(body);
          if (guideGiftPastRestingJar(body, motion)) stillPouring = true;
          continue;
        }

        // Give jammed gifts a path through the opening, including gifts wider than the neck.
        const halfOpening = Math.max(0, jarGeometry.mouthW / 2 - radius - jarGeometry.wallThickness / 2);
        const offset = body.position.x - mouth.x;
        const steer = Math.sign(offset) * Math.max(0, Math.abs(offset) - halfOpening);
        Matter.Sleeping.set(body, false);
        Body.setVelocity(body, {
          x: Math.max(-9, Math.min(9, -steer * 0.13)),
          y: Math.abs(steer) > 8 ? Math.min(3, Math.max(1.5, (mouth.y - body.position.y) * .08)) : Math.max(6, Math.min(10, body.velocity.y))
        });
        stillPouring = true;
      }
      if (stillPouring || motion.clearAt === undefined) motion.clearAt = time;
      return time - motion.clearAt < 120 || time - motion.pourStartedAt < 730;
    }

    function limitPourMomentum(time) {
      if (settlingPour && time >= settlingPour.until) settlingPour = undefined;
      const bodies = (flipAnimation?.draining ? flipAnimation.spilled : flipAnimation?.carried) ?? settlingPour?.bodies;
      if (!bodies) return;
      for (const body of bodies) {
        const { x, y } = body.velocity;
        // Contain the impulse when many gifts touch the rotating wall or regain collisions at once.
        if (Math.abs(x) > 16 || y < -5 || y > 30) {
          Body.setVelocity(body, { x: Math.max(-16, Math.min(16, x)), y: Math.max(-5, Math.min(30, y)) });
        }
      }
    }

    function updateJarMotion(time) {
      if (flipAnimation) {
        const { start, from, raised, tilted, carried, liftEnd, tipEnd } = flipAnimation;
        const elapsed = Math.max(0, time - start);
        if (elapsed < liftEnd) {
          const pose = mixPose(from, raised, elapsed / liftEnd);
          // The rising jar carries its contents. Once it tips, gravity and the walls take over.
          for (const body of giftBodies) {
            if (carried.has(body)) {
              const local = jarPoint(body.position, jarPose, true);
              Body.setPosition(body, jarPoint(local, pose));
            }
          }
          placeJar(pose, false);
        } else if (elapsed < tipEnd) {
          placeJar(mixPose(raised, tilted, (elapsed - liftEnd) / (tipEnd - liftEnd)), false);
        } else {
          if (flipAnimation.returnAt === undefined) {
            if (pourJarGifts(flipAnimation, time)) return;
            flipAnimation.returnAt = time;
          }
          const returning = time - flipAnimation.returnAt;
          if (returning < 520) {
            placeJar(mixPose(tilted, raised, returning / 520));
          } else if (returning < 1090) {
            placeJar(mixPose(raised, restPose, (returning - 520) / 570));
          } else {
            placeJar(restPose, false);
            const { spilled } = flipAnimation;
            settlingPour = { bodies: spilled, until: time + 900 };
            flipAnimation = undefined;
            jarState.isFlipped = false;
            for (const body of spilled) updateGiftCollisionMask(body);
            rebuildJarBodies();
            updateGoal();
          }
        }
        return;
      }

      if (!shakeAnimation) return;
      const { start, from, distance, duration } = shakeAnimation;
      const progress = Math.max(0, (time - start) / duration);
      if (progress >= 1) {
        placeJar(restPose, false);
        shakeAnimation = undefined;
        return;
      }
      const damping = (1 - progress) ** 1.8;
      const phase = progress * Math.PI * 4.8;
      const sway = Math.sin(phase);
      placeJar({
        x: (from.x + distance * sway) * damping,
        y: (from.y - distance * .23 * (1 - Math.cos(phase * 1.26))) * damping,
        angle: (from.angle - distance / Math.max(40, jarGeometry.w) * 1.35 * Math.sin(phase * .88)) * damping
      });
    }

    function setCrackLevel(value, playSound = true) {
      const level = Math.min(3, value);
      const previous = jarState.crackLevel;
      if (level <= previous) return;
      const now = performance.now();
      for (let i = previous; i < level; i++) crackStarts[i] = now + (i - previous) * 72;
      jarState.crackLevel = level;
      if (playSound) AudioEngine.playCrack();
    }

    function getJarArtwork() {
      const base = preloadImage(getJarBaseUrl(jarConfig.style));
      const front = preloadImage(jarConfig.frontOverlayImage);
      const signature = [base?.src, base?.naturalWidth, front?.src, front?.naturalWidth, jarConfig.style, jarConfig.hideDefaultJarOnCustom].join('|');
      if (jarArtwork?.geometry === jarGeometry && jarArtwork.signature === signature) return jarArtwork;
      jarArtwork = {
        geometry: jarGeometry, signature,
        texture: JarGlass.capture(jarGeometry, currentCavityPoints, art => {
          drawJarBackground(art, jarGeometry, jarConfig.style);
          drawJarForegroundHighlights(art, jarGeometry, jarConfig.style);
        })
      };
      return jarArtwork;
    }

    function drawActiveCracks(time) {
      const artwork = getJarArtwork();
      const duration = reducedMotion.matches ? 130 : 345;
      const progress = crackStarts.map(start => Math.max(0, Math.min(1, (time - start) / duration)));
      const staticFrame = progress.every(value => value === 1);
      if (!staticFrame || artwork.crackLevel !== jarState.crackLevel) {
        const pulse = reducedMotion.matches ? 0 : Math.max(0, 1 - (time - crackStarts[0]) / 180);
        JarGlass.paintCracks(artwork.texture, progress, Math.min(1, pulse));
        artwork.crackLevel = staticFrame ? jarState.crackLevel : undefined;
      }
      const { imgX, imgY, w, h } = jarGeometry;
      ctx.drawImage(artwork.texture.cracks, imgX, imgY, w, h);
    }

    function burstJarExplode(onGoal = false) {
      if (jarState.isBurst || jarState.isFlipped || pendingBreak) return;
      clearTimeout(goalBurstTimer);
      goalBurstTimer = undefined;
      setCrackLevel(3, false);
      pendingBreak = { onGoal, timer: setTimeout(() => {
        const reassemble = pendingBreak.assembleAfter;
        pendingBreak = undefined;
        if (!onGoal || canBurstOnGoal()) {
          shatterJar(onGoal);
          if (reassemble) assembleJar();
        }
      }, reducedMotion.matches ? 80 : 170) };
    }

    function shatterJar(onGoal) {
      const artwork = getJarArtwork();
      JarGlass.paintCracks(artwork.texture, [1, 1, 1]);
      artwork.crackLevel = undefined;
      const calm = reducedMotion.matches;
      const { imgX, imgY, w, h } = jarGeometry;
      const pieces = JarGlass.cutShards(artwork.texture, calm).map(piece => {
        const center = jarPoint({ x: imgX + piece.u * w, y: imgY + piece.v * h });
        const spread = calm ? 50 : Math.max(185, Math.min(500, w * 1.6));
        return {
          image: piece.image, x: center.x, y: center.y,
          u: piece.u, v: piece.v, relW: piece.w, relH: piece.h, w: piece.w * w, h: piece.h * h,
          angle: jarPose.angle, spin: (Math.random() - .5) * (calm ? 1.8 : 8),
          vx: (piece.u - .5) * spread + (Math.random() - .5) * spread * .42,
          vy: (piece.v - .52) * spread * .56 - 45 - Math.random() * (calm ? 32 : 124),
          bounces: 0, settled: false
        };
      });

      glassShards.push(...pieces);
      jarState.isBurst = true;
      shakeAnimation = undefined;
      // The gift count and goal belong to this live session, not the current glass.
      for (const body of giftBodies) {
        body.giftData.retainedAfterBreak = true;
        body.collisionFilter.mask = giftCollisionMask(true);
      }
      AudioEngine.playShatter();
      if (onGoal) {
        jarState.goalBurstUsed = true;
        AudioEngine.playFanfare();
        const banner = document.getElementById('celebration-banner');
        banner.classList.add('show');
        bannerTimer = setTimeout(() => banner.classList.remove('show'), 2900);
      }
      for (const body of wakeJarGifts()) {
        const dx = body.position.x - jarGeometry.cx - jarPose.x;
        const push = calm ? .55 : 1;
        Body.setVelocity(body, { x: body.velocity.x + Math.sign(dx) * (1.2 + Math.random() * 3) * push, y: body.velocity.y - 2 * push });
      }
      World.remove(engine.world, jarWalls);
      jarWalls = [];
      wallRest = [];
      jarPose = restPose;
    }

    function drawGlassShards(dt) {
      const elapsed = Math.max(0, dt) / 1000;
      for (const shard of glassShards) {
        const extent = Math.min(width / 2, Math.hypot(shard.w, shard.h) / 2);
        if (!shard.settled) {
          shard.vy += 1000 * elapsed;
          shard.x += shard.vx * elapsed;
          shard.y += shard.vy * elapsed;
          shard.angle += shard.spin * elapsed;
          if (shard.x < extent || shard.x > width - extent) shard.vx *= -.32;
        }
        shard.x = Math.max(extent, Math.min(width - extent, shard.x));

        const halfHeight = Math.abs(Math.sin(shard.angle)) * shard.w / 2 + Math.abs(Math.cos(shard.angle)) * shard.h / 2;
        const floor = height - halfHeight - 1;
        if (shard.settled || shard.y >= floor) {
          shard.y = floor;
          if (!shard.settled && shard.vy > 0) {
            shard.settled = ++shard.bounces >= 3 || shard.vy < 78;
            shard.vy *= -.26;
            shard.vx *= .58;
            shard.spin *= .60;
          }
        }
        drawShard(shard.image, shard.x, shard.y, shard.w, shard.h, shard.angle);
      }
    }

    function drawShard(image, x, y, w, h, angle, opacity = 1) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.drawImage(image, -w / 2, -h / 2, w, h);
      ctx.restore();
    }

    function assembleJar() {
      if (pendingBreak) {
        pendingBreak.assembleAfter = true;
        return;
      }
      if (!jarState.isBurst || assembly) return;

      // Move the existing pieces into the assembly so the floor no longer draws them.
      assembly = { pieces: glassShards, started: performance.now(), duration: reducedMotion.matches ? 300 : 820 };
      glassShards = [];
    }

    function drawAssembly(time) {
      if (!assembly) return;
      const progress = Math.max(0, (time - assembly.started) / assembly.duration);

      const { imgX, imgY, w, h } = jarGeometry;
      const ease = progress * progress * (3 - 2 * progress);
      const opacity = assembly.pieces.length ? Math.max(0, (progress - .68) / .32) : ease;
      for (const piece of assembly.pieces) {
        const x = piece.x + (imgX + piece.u * w - piece.x) * ease;
        const y = piece.y + (imgY + piece.v * h - piece.y) * ease;
        const pieceWidth = piece.w + (piece.relW * w - piece.w) * ease;
        const pieceHeight = piece.h + (piece.relH * h - piece.h) * ease;
        drawShard(piece.image, x, y, pieceWidth, pieceHeight, piece.angle * (1 - ease), 1 - opacity);
      }
      if (opacity > 0) {
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.drawImage(getJarArtwork().texture.art, imgX, imgY, w, h);
        ctx.restore();
      }
    }

    function resetVisualEffects() {
      clearTimeout(pendingBreak?.timer);
      clearTimeout(bannerTimer);
      pendingBreak = undefined;
      if (assembly) glassShards = assembly.pieces;
      assembly = undefined;
      flipAnimation = undefined;
      settlingPour = undefined;
      shakeAnimation = undefined;
      jarState.isBurst = false;
      jarState.isFlipped = false;
      placeJar(restPose, false);
      sparkleParticles = [];
      document.getElementById('celebration-banner').classList.remove('show');
    }

    function clearAllGifts() {
      World.remove(engine.world, giftBodies);
      giftBodies = [];
      airborneGifts.clear();
      pendingDrops.length = 0;
      queuedGiftCount = 0;
      restoredGiftBatches = [];
      restoredPositions = [];
      restoreGrid = undefined;
      checkpointDirty = true;
      giftInventory.clear();
      inventoryDirty = true;
      nextDropAt = 0;
      sparkleParticles = [];
    }

    function removeGiftBodies(key) {
      const remaining = [];
      const removed = [];
      for (const body of giftBodies) {
        if (body.giftData.key === key) {
          airborneGifts.delete(body);
          removed.push(body);
          adjustGiftInventory(body.giftData, -1, 0);
        } else {
          remaining.push(body);
        }
      }
      World.remove(engine.world, removed);
      giftBodies = remaining;
    }

    function removeGiftType(key) {
      removeGiftBodies(key);
      for (let i = pendingDrops.length - 1; i >= 0; i--) {
        if (pendingDrops[i].data.key === key) {
          queuedGiftCount -= pendingDrops[i].remaining;
          pendingDrops.splice(i, 1);
        }
      }
      restoredGiftBatches = restoredGiftBatches.filter(batch => batch.data.key !== key);
      restoredPositions = restoredPositions.filter(item => item.data.key !== key);
      checkpointDirty = true;
      giftInventory.delete(key);
      inventoryDirty = true;
      if (!pendingDrops.length) nextDropAt = 0;
    }

    function resetJarGoal() {
      clearTimeout(goalBurstTimer);
      goalBurstTimer = undefined;
      jarState.currentCoins = 0;
      jarState.goalCrackLevel = 0;
      jarState.goalBurstUsed = false;
      resetJarCracks();
      if (pendingBreak?.onGoal) {
        clearTimeout(pendingBreak.timer);
        pendingBreak = undefined;
      }
      updateGoal();
    }

    function resetJarCracks() {
      jarState.crackLevel = 0;
      crackStarts.length = 0;
      if (jarArtwork) jarArtwork.crackLevel = undefined;
    }

    function canBurstOnGoal() {
      return jarConfig.enabled && jarConfig.goalEnabled && jarConfig.autoBurstOnGoal &&
        !jarState.goalBurstUsed && !jarState.isBurst && !pendingBreak && !jarState.isFlipped && jarState.currentCoins >= (Number(jarConfig.goalTargetCoins) || 500);
    }

    function updateGoal(addedCoins = 0) {
      jarState.currentCoins += addedCoins;
      const target = Number(jarConfig.goalTargetCoins) || 500;
      const curr = jarState.currentCoins;
      const pct = Math.min(100, Math.round(curr / target * 100));
      const hud = document.getElementById('goal-hud');
      hud.style.display = jarConfig.goalEnabled ? 'flex' : 'none';
      document.getElementById('hudGoalCounter').textContent = String(curr.toLocaleString('vi-VN')) + ' / ' + target.toLocaleString('vi-VN') + ' xu';
      document.getElementById('hudGoalFill').style.width = pct + '%';

      if (jarConfig.goalEnabled) {
        const level = pct >= 90 ? 3 : pct >= 60 ? 2 : pct >= 30 ? 1 : 0;
        if (level > jarState.goalCrackLevel) {
          jarState.goalCrackLevel = level;
          if (!jarState.isBurst) setCrackLevel(level);
        }
        if (curr >= target && jarState.isBurst && jarConfig.autoBurstOnGoal) jarState.goalBurstUsed = true;
      }
      if (canBurstOnGoal() && !goalBurstTimer) {
        goalBurstTimer = setTimeout(() => {
          goalBurstTimer = undefined;
          if (canBurstOnGoal()) burstJarExplode(true);
        }, 950);
      }
    }

    // ==========================================
    // 7. RENDER VẼ HŨ & HIỆU ỨNG ĐỒ HOẠ (CANVAS 60FPS)
    // ==========================================

    // Hào quang neon phát sáng nhẹ xung quanh hũ (Ánh pha lê cầu vồng dịu dàng, trong suốt OBS)
    function drawAuraGlow(ctx, geom) {
      if (jarConfig.glowEffect === false) return;
      const { bowlCx, bowlCy, bowlR, isFishbowl, cx, cy, w } = geom;
      ctx.save();
      const pulse = 0.08 + 0.04 * Math.sin(Date.now() * 0.003);
      const centerX = isFishbowl ? bowlCx : cx;
      const centerY = isFishbowl ? bowlCy : cy;
      const rad = isFishbowl ? (bowlR * 1.35) : (w * 0.65);

      const grad = ctx.createRadialGradient(centerX, centerY, rad * 0.25, centerX, centerY, rad);
      grad.addColorStop(0, `rgba(254, 240, 138, ${pulse * 1.0})`);
      grad.addColorStop(0.45, `rgba(244, 114, 182, ${pulse * 0.45})`);
      grad.addColorStop(0.8, `rgba(186, 230, 253, ${pulse * 0.25})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function getJarBaseUrl(style) {
      return jarConfig.customJarImage || (style === 'fishbowl' ? '/builtin/jar/iridescent_fishbowl_transparent.png' : '');
    }

    // Vẽ hình dáng hũ theo các phong cách (kể cả ảnh mẫu tùy chọn)
    function drawJarBackground(ctx, geom, style) {
      const { imgX, imgY, w, h } = geom;
      const image = preloadImage(getJarBaseUrl(style));
      const hasImage = image?.complete && image.naturalWidth > 0;
      ctx.save();
      if (!hasImage || jarConfig.hideDefaultJarOnCustom === false) drawJarSilhouette(ctx, geom, style, jarConfig.jarScale || 1);
      if (hasImage) ctx.drawImage(image, imgX, imgY, w, h);
      ctx.restore();
    }

    function drawJarForegroundHighlights(ctx, geom, style) {
      const { cx, cy, w, h, imgX, imgY, neckW, neckH, aspect, isFishbowl } = geom;
      const scale = jarConfig.jarScale || 1.0;

      // 1. Nếu có ảnh Overlay mặt trước (Front Overlay: Nơ, cổ bèo, viền miệng hũ, bóng kính pha lê)
      const overlayUrl = jarConfig.frontOverlayImage;
      if (overlayUrl) {
        const overlayImg = preloadImage(overlayUrl);
        if (overlayImg && overlayImg.complete && overlayImg.naturalWidth > 0) {
          ctx.save();
          ctx.drawImage(overlayImg, imgX, imgY, w, h);
          ctx.restore();
          return;
        }
      }

      // Nếu đang dùng ảnh hũ riêng, tuyệt đối KHÔNG vẽ viền nét vector Mason jar đè lên
      if (jarConfig.customJarImage || isFishbowl || style === 'custom_image') return;

      const halfW = w / 2;
      const halfH = h / 2;
      const halfNeckW = neckW / 2;
      const cornerR = (aspect === 'horizontal' ? 44 : 36) * scale;

      ctx.save();

      // Vạch sáng phản chiếu dọc viền bo cong bên trái
      const lightGrad = ctx.createLinearGradient(cx - halfW + 10, cy, cx - halfW + 48, cy);
      lightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
      lightGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.18)');
      lightGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = lightGrad;
      ctx.beginPath();
      ctx.moveTo(cx - halfW + 14, cy - halfH + neckH + 28);
      ctx.lineTo(cx - halfW + 32, cy - halfH + neckH + 28);
      ctx.lineTo(cx - halfW + 30, cy + halfH - cornerR - 10);
      ctx.quadraticCurveTo(cx - halfW + 18, cy + halfH - 12, cx - halfW + cornerR, cy + halfH - 14);
      ctx.lineTo(cx - halfW + 14, cy + halfH - cornerR);
      ctx.closePath();
      ctx.fill();

      // Viền loá sáng mỏng thanh thoát dọc cạnh phải
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx + halfW - 14, cy - halfH + neckH + 30);
      ctx.lineTo(cx + halfW - 14, cy + halfH - cornerR);
      ctx.stroke();

      // Đường nét viền kính mềm mại theo đúng hình dáng hũ bo góc
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx - halfW + cornerR, cy + halfH);
      ctx.lineTo(cx + halfW - cornerR, cy + halfH);
      ctx.quadraticCurveTo(cx + halfW, cy + halfH, cx + halfW, cy + halfH - cornerR);
      ctx.lineTo(cx + halfW, cy - halfH + neckH + 24);
      ctx.quadraticCurveTo(cx + halfW, cy - halfH + neckH, cx + halfNeckW, cy - halfH + neckH);
      ctx.lineTo(cx + halfNeckW, cy - halfH);
      ctx.lineTo(cx - halfNeckW, cy - halfH);
      ctx.lineTo(cx - halfNeckW, cy - halfH + neckH);
      ctx.quadraticCurveTo(cx - halfW, cy - halfH + neckH, cx - halfW, cy - halfH + neckH + 24);
      ctx.lineTo(cx - halfW, cy + halfH - cornerR);
      ctx.quadraticCurveTo(cx - halfW, cy + halfH, cx - halfW + cornerR, cy + halfH);
      ctx.stroke();

      // Ren xoắn cổ hũ và vành miệng bo tròn
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(cx, cy - halfH + 4, halfNeckW + 4, 8, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    // Vẽ sticker / decor theo phân tầng ('behind_glass' hoặc 'front')
    function drawDecorStickers(ctx, geom, targetLayer = 'front') {
      const { cx, cy, w, h } = geom;
      const scale = jarConfig.jarScale || 1.0;

      // 1. Vẽ mảng stickers tùy chỉnh
      if (Array.isArray(jarConfig.stickers) && jarConfig.stickers.length > 0) {
        jarConfig.stickers.forEach(stk => {
          if (!stk || !stk.url) return;
          const stkLayer = stk.layer || 'front';
          if (stkLayer !== targetLayer) return;

          const img = preloadImage(stk.url);
          if (!img || !img.complete || img.naturalWidth === 0) return;

          const stkX = cx + ((stk.x !== undefined ? stk.x - 50 : 0) / 100) * w;
          const stkY = cy + ((stk.y !== undefined ? stk.y - 50 : 0) / 100) * h;
          const stkScale = stk.scale ?? 1;
          const stkRot = ((stk.rotation || 0) * Math.PI) / 180;
          const stkAlpha = stk.opacity !== undefined ? stk.opacity : 1.0;

          const baseStkW = w * 0.52;
          const drawW = baseStkW * stkScale;
          const drawH = (img.naturalHeight / img.naturalWidth) * drawW;

          ctx.save();
          ctx.translate(stkX, stkY);
          ctx.rotate(stkRot);
          ctx.globalAlpha = stkAlpha;
          ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
          ctx.restore();
        });
      }

      // 2. Tương thích ngược decorImage đơn lẻ (nếu chưa có trong stickers)
      if (targetLayer === 'front' && jarConfig.decorImage) {
        const alreadyInStickers = Array.isArray(jarConfig.stickers) && jarConfig.stickers.some(s => s && s.url === jarConfig.decorImage);
        if (!alreadyInStickers) {
          const img = preloadImage(jarConfig.decorImage);
          if (img && img.complete && img.naturalWidth > 0) {
            let targetY = cy;
            if (jarConfig.decorPosition === 'top') targetY = cy - h * 0.28;
            else if (jarConfig.decorPosition === 'bottom') targetY = cy + h * 0.34;
            else if (jarConfig.decorPosition === 'neck') targetY = cy - h * 0.38;

            const dScale = (jarConfig.decorScale || 1.0) * scale;
            const opacity = jarConfig.decorOpacity !== undefined ? jarConfig.decorOpacity : 0.95;
            const targetW = (w * 0.52) * dScale;
            const targetH = (img.naturalHeight / img.naturalWidth) * targetW;

            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.drawImage(img, cx - targetW / 2, targetY - targetH / 2, targetW, targetH);
            ctx.restore();
          }
        }
      }
    }

    // ========================================================
    // HIỆU ỨNG DẢI SÁNG LẤP LÁNH CHẠY QUANH VIỀN HŨ (60FPS CAUSTIC SHIMMER & TWINKLING SPARKLES)
    // ========================================================
    let rimSparkles = [];

    function drawRealisticRimShimmer(ctx, geom, time) {
      if (jarConfig.shimmerRimEffect === false) return;
      const { cx, cy, w, h, imgX, imgY, bowlCx, bowlCy, bowlR, mouthY, mouthW, isFishbowl } = geom;
      const scale = jarConfig.jarScale || 1.0;
      const speed = Number(jarConfig.shimmerRimSpeed) || 1.0;

      // 1. Tọa độ vành miệng elip trên cùng
      const mouthX = bowlCx || cx;
      const topMouthY = imgY ? (imgY + h * 0.125) : (cy - h * 0.375);
      const mouthRx = w * 0.25;
      const mouthRy = h * 0.046;

      // Góc quét liên tục của chùm sáng
      const sweepAngle = (time * 0.0019 * speed) % (Math.PI * 2);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Điểm đầu của chùm sao chổi
      const headX = mouthX + Math.cos(sweepAngle) * mouthRx;
      const headY = topMouthY + Math.sin(sweepAngle) * mouthRy;

      // Vẽ vệt đuôi gradient ánh cầu vồng mềm mại
      const trailAngle = sweepAngle - 0.75;
      const tailX = mouthX + Math.cos(trailAngle) * mouthRx;
      const tailY = topMouthY + Math.sin(trailAngle) * mouthRy;

      const trailGrad = ctx.createLinearGradient(headX, headY, tailX, tailY);
      trailGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
      trailGrad.addColorStop(0.25, 'rgba(167, 243, 208, 0.75)');
      trailGrad.addColorStop(0.65, 'rgba(244, 114, 182, 0.4)');
      trailGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.strokeStyle = trailGrad;
      ctx.lineWidth = 3.8 * scale;
      ctx.beginPath();
      ctx.ellipse(mouthX, topMouthY, mouthRx, mouthRy, 0, trailAngle, sweepAngle, false);
      ctx.stroke();

      // Hào quang tỏa sáng tại đầu chùm tia sáng
      const flareGrad = ctx.createRadialGradient(headX, headY, 0, headX, headY, 20 * scale);
      flareGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      flareGrad.addColorStop(0.3, 'rgba(253, 224, 71, 0.85)');
      flareGrad.addColorStop(0.6, 'rgba(244, 114, 182, 0.35)');
      flareGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = flareGrad;
      ctx.beginPath();
      ctx.arc(headX, headY, 20 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Sao 4 cánh lấp lánh tại tâm chùm sáng
      drawDiamondStar(ctx, headX, headY, 14 * scale, 1.0, '#ffffff');

      // 2. Chùm sáng thứ hai chạy êm đềm dọc đường viền bụng dưới hũ pha lê
      const bellyCenterY = bowlCy || (cy + h * 0.08);
      const bellyRadius = bowlR || ((w / 2) * 0.88);
      const bellySweep = Math.PI * 0.18 + (Math.sin(time * 0.0014 * speed) * 0.5 + 0.5) * (Math.PI * 0.64);
      const bellyX = (bowlCx || cx) + Math.cos(bellySweep) * bellyRadius;
      const bellyPtY = bellyCenterY + Math.sin(bellySweep) * bellyRadius;

      const bFlare = ctx.createRadialGradient(bellyX, bellyPtY, 0, bellyX, bellyPtY, 18 * scale);
      bFlare.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      bFlare.addColorStop(0.4, 'rgba(125, 211, 252, 0.5)');
      bFlare.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = bFlare;
      ctx.beginPath();
      ctx.arc(bellyX, bellyPtY, 18 * scale, 0, Math.PI * 2);
      ctx.fill();

      // 3. Các ngôi sao pha lê nhấp nháy tĩnh tại các điểm nhấn (Nơ hồng, ngọc trai, ren cổ)
      const bowPulse = (Math.sin(time * 0.0032) * 0.5 + 0.5);
      drawDiamondStar(ctx, (bowlCx || cx) + w * 0.33, (imgY ? imgY + h * 0.27 : cy - h * 0.26), (12 + bowPulse * 8) * scale, 0.4 + bowPulse * 0.6, '#ffd1dc');

      const pearlPulse = (Math.sin(time * 0.004 + 1.5) * 0.5 + 0.5);
      drawDiamondStar(ctx, (bowlCx || cx) + w * 0.31, (imgY ? imgY + h * 0.35 : cy - h * 0.17), (10 + pearlPulse * 7) * scale, 0.35 + pearlPulse * 0.65, '#e0f2fe');

      const leftPulse = (Math.sin(time * 0.0036 + 3.0) * 0.5 + 0.5);
      drawDiamondStar(ctx, (bowlCx || cx) - w * 0.31, (imgY ? imgY + h * 0.22 : cy - h * 0.32), (10 + leftPulse * 6) * scale, 0.35 + leftPulse * 0.65, '#fef08a');

      // 4. Các hạt sao lấp lánh ngẫu nhiên sinh ra dọc viền hũ
      if (jarConfig.shimmerSparkles !== false && Math.random() < 0.14) {
        const onRim = Math.random() < 0.65;
        let sx, sy;
        if (onRim) {
          const a = Math.random() * Math.PI * 2;
          sx = mouthX + Math.cos(a) * mouthRx + (Math.random() - 0.5) * 6;
          sy = topMouthY + Math.sin(a) * mouthRy + (Math.random() - 0.5) * 6;
        } else {
          const a = Math.PI * 0.15 + Math.random() * Math.PI * 0.7;
          sx = (bowlCx || cx) + Math.cos(a) * bellyRadius + (Math.random() - 0.5) * 8;
          sy = bellyCenterY + Math.sin(a) * bellyRadius + (Math.random() - 0.5) * 8;
        }
        rimSparkles.push({
          x: sx,
          y: sy,
          size: (5 + Math.random() * 8) * scale,
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.06,
          alpha: 1.0,
          decay: 0.02 + Math.random() * 0.025,
          color: ['#ffffff', '#fde047', '#f472b6', '#38bdf8', '#a7f3d0'][Math.floor(Math.random() * 5)]
        });
      }

      for (let i = rimSparkles.length - 1; i >= 0; i--) {
        const s = rimSparkles[i];
        s.alpha -= s.decay;
        s.rot += s.vrot;
        if (s.alpha <= 0) {
          rimSparkles.splice(i, 1);
          continue;
        }
        drawDiamondStar(ctx, s.x, s.y, s.size, s.alpha, s.color, s.rot);
      }

      ctx.restore();
    }

    // Hàm vẽ ngôi sao 4 cánh lấp lánh (Diamond Starburst)
    function drawDiamondStar(ctx, x, y, size, alpha, color, rot = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

      // Lõi sáng trung tâm
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.75);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, color);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.75, 0, Math.PI * 2);
      ctx.fill();

      // Cánh sao dọc nhọn mềm mại
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.quadraticCurveTo(size * 0.12, 0, 0, size);
      ctx.quadraticCurveTo(-size * 0.12, 0, 0, -size);
      ctx.fill();

      // Cánh sao ngang
      ctx.beginPath();
      ctx.moveTo(-size, 0);
      ctx.quadraticCurveTo(0, size * 0.12, size, 0);
      ctx.quadraticCurveTo(0, -size * 0.12, -size, 0);
      ctx.fill();

      ctx.restore();
    }

    // ========================================================
    // ĐỒ HỌA THỦY TINH 3D CHÂN THỰC (REALISTIC GLASS OPTICS)
    // ========================================================

    // 1. Chiều sâu không gian 3D lòng hũ kính (vẽ TRƯỚC quà)
    function drawInnerGlassDepth(ctx, geom) {
      // Giữ lòng hũ trong suốt 100% tự nhiên theo ảnh hũ gốc
    }

    // 2. Lớp phản chiếu ánh sáng và vệt bóng mặt kính trước (vẽ TRÊN quà)
    function drawGlassFrontReflection(ctx, geom) {
      if (jarConfig.glassRealism === false) return;
      const hitboxCfg = jarConfig.hitbox || {};
      const rx = geom.w * (hitboxCfg.radiusX !== undefined ? hitboxCfg.radiusX : 0.315);
      const ry = geom.h * (hitboxCfg.radiusY !== undefined ? hitboxCfg.radiusY : 0.24);
      const cavityCy = geom.imgY + geom.h * (hitboxCfg.centerY !== undefined ? hitboxCfg.centerY : 0.58) + (hitboxCfg.offsetY || 0);
      const cavityCx = geom.cx + (hitboxCfg.offsetX || 0);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // Vệt phản xạ ánh bóng cong hình lưỡi liềm bên trái (Curved Specular Crescent)
      const specX = cavityCx - rx * 0.45;
      const specY = cavityCy - ry * 0.35;
      const specR = rx * 0.48;

      const specGrad = ctx.createRadialGradient(specX, specY, 0, specX, specY, specR);
      specGrad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
      specGrad.addColorStop(0.45, 'rgba(224, 242, 254, 0.08)');
      specGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = specGrad;
      ctx.beginPath();
      ctx.ellipse(specX, specY, specR, specR * 0.65, -Math.PI / 5, 0, Math.PI * 2);
      ctx.fill();

      // Viền phản quang mỏng thanh thoát dọc mép kính
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(cavityCx, cavityCy, rx * 0.94, ry * 0.94, 0, 0.72 * Math.PI, 1.10 * Math.PI, false);
      ctx.stroke();

      ctx.restore();
    }

    // 3. Khung dây vật lý hỗ trợ căn chỉnh chuẩn xác theo mọi ảnh mẫu hũ (Debug Hitbox Wireframe)
    function drawDebugHitbox(ctx, geom, points) {
      if (!jarConfig.debugHitbox || !points || points.length < 3) return;

      ctx.save();
      // a. Đường viền lòng hũ (Neon Cyan Dash)
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 3.0;
      ctx.setLineDash([8, 5]);
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();

      // b. Các chốt đỉnh (Amber Dots)
      ctx.setLineDash([]);
      ctx.fillStyle = '#f59e0b';
      for (let i = 0; i < points.length; i++) {
        ctx.beginPath();
        ctx.arc(points[i].x, points[i].y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // c. Tâm lòng hũ & hồng tâm căn chỉnh (Red Crosshair)
      const hitboxCfg = jarConfig.hitbox || {};
      const cavityCy = geom.imgY + geom.h * (hitboxCfg.centerY !== undefined ? hitboxCfg.centerY : 0.58) + (hitboxCfg.offsetY || 0);
      const cavityCx = geom.cx + (hitboxCfg.offsetX || 0);

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.0;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(cavityCx - 22, cavityCy);
      ctx.lineTo(cavityCx + 22, cavityCy);
      ctx.moveTo(cavityCx, cavityCy - 22);
      ctx.lineTo(cavityCx, cavityCy + 22);
      ctx.stroke();

      // d. Bảng thông số đo đạc trực quan
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(cavityCx - 95, cavityCy - 48, 190, 26);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      ctx.strokeRect(cavityCx - 95, cavityCy - 48, 190, 26);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`HITBOX: ${hitboxCfg.shape || 'sphere'} [${points.length} pts]`, cavityCx, cavityCy - 35);

      ctx.restore();
    }

    // Vẽ một hạt quà vật lý (Gift Sprite)
    function drawGiftBody(ctx, b) {
      const { x, y } = b.position;
      const r = b.giftData?.radius || b.circleRadius || 18;
      const angle = b.angle;
      const data = b.giftData || {};

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Đổ bóng nhẹ dưới quà
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      const detailedShadow = giftBodies.length < 200 || r >= 18;
      ctx.shadowBlur = detailedShadow ? 6 : 0;
      ctx.shadowOffsetY = detailedShadow ? 2 : 0;

      let img = null;
      if (data.iconUrl) {
        img = preloadImage(data.iconUrl);
      }

      if (img && img.complete && img.naturalWidth > 0) {
        const fit = (r * 2) / Math.max(img.naturalWidth, img.naturalHeight);
        const w = img.naturalWidth * fit;
        const h = img.naturalHeight * fit;
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
      } else {
        // Fallback: Vẽ huy hiệu bo tròn kèm emoji thông minh
        const coins = data.coins || 1;
        let bgGrad = ctx.createLinearGradient(-r, -r, r, r);
        if (coins === 1) {
          bgGrad.addColorStop(0, '#f43f5e'); bgGrad.addColorStop(1, '#e11d48');
        } else if (coins <= 9) {
          bgGrad.addColorStop(0, '#ec4899'); bgGrad.addColorStop(1, '#be185d');
        } else if (coins <= 99) {
          bgGrad.addColorStop(0, '#f59e0b'); bgGrad.addColorStop(1, '#d97706');
        } else if (coins <= 999) {
          bgGrad.addColorStop(0, '#8b5cf6'); bgGrad.addColorStop(1, '#6d28d9');
        } else {
          bgGrad.addColorStop(0, '#ef4444'); bgGrad.addColorStop(1, '#b91c1c');
        }

        ctx.fillStyle = bgGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // Biểu tượng Emoji
        let emoji = '🎁';
        const name = (data.giftName || '').toLowerCase();
        if (name.includes('hồng') || name.includes('rose')) emoji = '🌹';
        else if (name.includes('bánh vòng') || name.includes('donut')) emoji = '🍩';
        else if (name.includes('sư tử') || name.includes('lion')) emoji = '🦁';
        else if (name.includes('vũ trụ') || name.includes('universe')) emoji = '🌌';
        else if (coins === 1) emoji = '🌹';
        else if (coins === 30) emoji = '🍩';

        ctx.font = `${Math.round(r * 1.1)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, 0, 1);
      }

      ctx.restore();
    }

    // ==========================================
    // 8. MAIN ANIMATION LOOP (60FPS OBS RENDERING)
    // ==========================================
    let lastTime = performance.now();
    let physicsTime = 0;

    function renderLoop(time) {
      requestAnimationFrame(renderLoop);
      const dt = Math.min(50, time - lastTime);
      lastTime = time;
      if (!jarConfig.enabled) return;
      if (assembly && time - assembly.started >= assembly.duration) {
        assembly = undefined;
        jarState.isBurst = false;
        resetJarCracks();
        rebuildJarBodies();
        updateGoal();
      }
      spawnRestoredGifts();
      spawnPendingGifts(time);
      advanceAirborneGifts(time);
      physicsTime += Math.max(0, dt);
      const step = 1000 / 120;
      while (physicsTime >= step) {
        const physicsAt = time - physicsTime + step;
        updateJarMotion(physicsAt);
        Engine.update(engine, step);
        limitPourMomentum(physicsAt);
        physicsTime -= step;
      }

      if (jarConfig.enableFloorAccumulation === false) {
        for (let i = giftBodies.length - 1; i >= 0; i--) {
          const body = giftBodies[i];
          if (!body.giftData.retainedAfterBreak && body.position.y - body.giftData.radius > height + 40) {
            World.remove(engine.world, body);
            giftBodies.splice(i, 1);
            checkpointDirty = true;
            adjustGiftInventory(body.giftData, -1, 0);
          }
        }
      }

      // 2. Xoá canvas trong suốt
      ctx.clearRect(0, 0, width, height);

      const sceneTransform = ctx.getTransform();
      ctx.save();
      const { cx, cy } = jarGeometry;
      ctx.translate(cx + jarPose.x, cy + jarPose.y);
      ctx.rotate(jarPose.angle);
      ctx.translate(-cx, -cy);

      // --- LAYER 0: HÀO QUANG NEON (AURA GLOW) ---
      if (!jarState.isBurst) {
        drawAuraGlow(ctx, jarGeometry);
      }

      // --- LAYER 1: MẶT SAU & THÂN THỦY TINH TRONG SUỐT (BASE BOWL) ---
      if (!jarState.isBurst) {
        drawJarBackground(ctx, jarGeometry, jarConfig.style);
        drawInnerGlassDepth(ctx, jarGeometry);
      }

      // --- LAYER 2: DECOR / STICKERS DƯỚI KÍNH (BEHIND-GLASS) ---
      if (!jarState.isBurst) {
        drawDecorStickers(ctx, jarGeometry, 'behind_glass');
      }

      // Matter bodies already live in screen coordinates. The glass alone uses the visual transform.
      ctx.save();
      ctx.setTransform(sceneTransform);
      let cavity;
      if (jarConfig.clipGiftsToJar && !jarState.isBurst && currentCavityPoints.length > 2) {
        cavity = new Path2D();
        currentCavityPoints.forEach((point, index) => {
          const { x, y } = jarPose === restPose ? point : jarPoint(point);
          if (index) cavity.lineTo(x, y);
          else cavity.moveTo(x, y);
        });
        cavity.closePath();
      }
      for (const body of giftBodies) {
        const radius = body.giftData.radius;
        if (body.position.y + radius < 0 || body.position.y - radius > height) continue;
        const local = cavity && jarPose !== restPose ? jarPoint(body.position, jarPose, true) : body.position;
        if (cavity && local.y - radius > jarGeometry.mouthY && Math.abs(local.x - cx) < jarGeometry.w * .56 &&
            isInsideCavity(local, currentCavityPoints)) {
          ctx.save();
          ctx.clip(cavity);
          drawGiftBody(ctx, body);
          ctx.restore();
        } else {
          drawGiftBody(ctx, body);
        }
      }
      ctx.restore();

      // --- LAYER 4: HIỆU ỨNG PHẢN CHIẾU ÁNH BÓNG MẶT KÍNH TRƯỚC (QUÉT LÊN TRÊN QUÀ) ---
      if (!jarState.isBurst) {
        drawGlassFrontReflection(ctx, jarGeometry);
      }

      // --- LAYER 5: MẶT TRƯỚC PHẢN CHIẾU ÁNH SÁNG, NƠ, CỔ BÈO & BÓNG KÍNH (FOREGROUND OVERLAY) ---
      if (!jarState.isBurst) {
        drawJarForegroundHighlights(ctx, jarGeometry, jarConfig.style);
      }

      // --- LAYER 6: DECOR & STICKERS MẶT TRƯỚC HŨ ---
      if (!jarState.isBurst) {
        drawDecorStickers(ctx, jarGeometry, 'front');
      }

      // --- LAYER 7: HIỆU ỨNG DẢI SÁNG LẤP LÁNH CHẠY QUANH VIỀN HŨ (60FPS CAUSTIC SHIMMER & SPARKLES) ---
      if (!jarState.isBurst) {
        if (!reducedMotion.matches) drawRealisticRimShimmer(ctx, jarGeometry, time);
      }

      // --- LAYER 8: CÁC ĐƯỜNG NỨT THỦY TINH (CRACKS) ---
      if (!jarState.isBurst && jarState.crackLevel > 0) {
        drawActiveCracks(time);
      }

      // --- LAYER 9: KHUNG DÂY VẬT LÝ CĂN CHỈNH (DEBUG HITBOX WIREFRAME) ---
      if (!jarState.isBurst && jarConfig.debugHitbox) {
        drawDebugHitbox(ctx, jarGeometry, currentCavityPoints);
      }

      ctx.restore();

      drawGlassShards(dt);
      drawAssembly(time);

      // --- LAYER 7: BỤI SÁNG LẤP LÁNH KHI QUÀ RƠI (SPARKLE DUST) ---
      if (sparkleParticles.length > 0) {
        ctx.save();
        for (let i = sparkleParticles.length - 1; i >= 0; i--) {
          const sp = sparkleParticles[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.alpha -= sp.decay;

          if (sp.alpha <= 0) {
            sparkleParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = sp.alpha;
          ctx.fillStyle = sp.color;
          ctx.shadowColor = sp.color;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

    }
    requestAnimationFrame(renderLoop);

    // ==========================================
    // 9. KẾT NỐI WEBSOCKET NHẬN SỰ KIỆN TỪ SERVER
    // ==========================================
    const socket = io({
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 3000,
      timeout: 20000,
      transports: ['websocket', 'polling']
    });

    let configRevision = 0;
    let configReady = false;

    function applyJarConfig(config) {
      const previous = jarConfig;
      jarConfig = { ...previous, ...config };
      document.getElementById('stage-container').hidden = !jarConfig.enabled;
      AudioEngine.enabled = !previewMode && jarConfig.soundEnabled !== false;
      AudioEngine.volume = Number(jarConfig.soundVolume ?? 0.7);
      engine.world.gravity.y = (Number(jarConfig.gravity) || 1) * (Number(jarConfig.fallSpeed) || 1);

      if (!jarConfig.enabled && previous.enabled) {
        jarHiddenAt = performance.now();
        saveJarCheckpoint(true);
      } else if (jarConfig.enabled && jarHiddenAt !== undefined) {
        const hiddenFor = performance.now() - jarHiddenAt;
        for (const body of airborneGifts) body.giftData.arrival.start += hiddenFor;
        jarHiddenAt = undefined;
        nextDropAt = 0;
      }
      const changed = (keys) => keys.some(key => JSON.stringify(previous[key]) !== JSON.stringify(jarConfig[key]));
      if (!configReady || changed(['style', 'jarAspect', 'jarPosX', 'jarPosY', 'jarScale', 'hitbox', 'bounciness'])) rebuildJarBodies();
      if (changed(['enableFloorAccumulation'])) {
        giftBodies.forEach(updateGiftCollisionMask);
      }
      if (changed(['giftScaleGlobal', 'giftSizeSmall', 'giftSizeMedium', 'giftSizeLarge', 'giftSizeVIP'])) resizeActiveGiftBodies();
      if (changed(['giftCapacity', 'giftCapacityUnlimited'])) limitGiftBodies();
      checkpointDirty = true;
      if (changed(['bounciness'])) giftBodies.forEach(body => { body.restitution = Number(jarConfig.bounciness); });
      configReady = true;
      updateGoal();
      publishJarState();
    }

    function acceptJarSessionEvent(payload) {
      if (!payload?.sessionId) return Boolean(payload);
