      // The snapshot covers events emitted before this source finished connecting.
      if (jarSyncPending || payload.sessionId !== jarSessionId || payload.sequence <= jarEventSequence) return false;
      jarEventSequence = payload.sequence;
      return true;
    }

    function restoreJarSession(snapshot) {
      if (!snapshot?.sessionId || !Array.isArray(snapshot.gifts)) return;
      jarSyncPending = false;
      if (snapshot.sessionId === jarSessionId && snapshot.sequence === jarEventSequence) return;

      jarSessionId = snapshot.sessionId;
      jarEventSequence = snapshot.sequence;
      clearAllGifts();
      resetVisualEffects();
      resetJarGoal();
      rebuildJarBodies();
      const coins = Number(snapshot.coins) || 0;
      jarState.goalBurstUsed = coins >= (Number(jarConfig.goalTargetCoins) || 500);
      updateGoal(coins);

      let capacity = jarConfig.giftCapacityUnlimited === true
        ? Infinity : Math.max(1, Math.trunc(Number(jarConfig.giftCapacity) || 600));
      const batches = new Map();
      for (const gift of snapshot.gifts.slice().reverse()) {
        if (capacity <= 0) break;
        const data = normalizeJarGift(gift);
        if (!data) continue;
        const remaining = Math.min(capacity, data.count);
        batches.set(data.key, { data, remaining });
        capacity -= remaining;
      }

      for (const [key, x, y, angle, retained] of snapshot.positions || []) {
        const batch = batches.get(key);
        if (!batch?.remaining) continue;
        restoredPositions.push({ data: batch.data, x: x * width, y: y * height, angle, retained });
        batch.remaining--;
      }
      restoredPositions.reverse();
      restoredGiftBatches = [...batches.values()].filter(batch => batch.remaining).reverse();
    }

    function getStoredGiftPosition(radius) {
      if (!restoreGrid) {
        const smallest = Math.min(...restoredGiftBatches.map(batch => getGiftRadius(batch.data.coins)));
        restoreGrid = {
          size: smallest * 2 + 2, col: 0, row: 0, floor: 0, inside: true
        };
      }
      const grid = restoreGrid;
      const { bowlCx, bowlCy, bowlRx, bowlRy, mouthY } = jarGeometry;
      const columns = Math.max(1, Math.floor(bowlRx * 2 / grid.size));
      while (grid.inside) {
        const y = bowlCy + bowlRy - (grid.row + .5) * grid.size;
        if (y < mouthY + grid.size / 2) {
          grid.inside = false;
          break;
        }
        const x = bowlCx + (grid.col - (columns - 1) / 2) * grid.size;
        if (++grid.col >= columns) {
          grid.col = 0;
          grid.row++;
        }
        if (isInsideCavity({ x, y: y + radius + 2 }, currentCavityPoints) &&
            isInsideCavity({ x: x - radius, y }, currentCavityPoints) &&
            isInsideCavity({ x: x + radius, y }, currentCavityPoints)) return { x, y };
      }
      const shelf = Math.max(grid.size, radius * 2 + 2);
      const widthInSlots = Math.max(1, Math.floor(width / shelf));
      const floorSlots = widthInSlots * Math.max(1, Math.floor(height / shelf));
      const cell = grid.floor++ % floorSlots;
      return {
        x: width / 2 + (cell % widthInSlots - (widthInSlots - 1) / 2) * shelf,
        y: height - radius - 1 - Math.floor(cell / widthInSlots) * shelf
      };
    }

    function spawnRestoredGifts() {
      for (let added = 0; added < 60; added++) {
        const saved = restoredPositions.pop();
        const batch = restoredGiftBatches[0];
        if (!saved && !batch) break;

        const data = saved?.data || batch.data;
        const radius = getGiftRadius(data.coins);
        const { x, y } = saved || getStoredGiftPosition(radius);
        limitGiftBodies(1);
        const body = createJarGift(data, x, y, radius, saved?.retained === true, saved?.angle);
        Matter.Sleeping.set(body, true);
        adjustGiftInventory(data, 1, 0);
        if (!saved && --batch.remaining === 0) restoredGiftBatches.shift();
      }
    }

    function saveJarCheckpoint(force = false) {
      if (!jarSessionId || !socket.connected || restoredPositions.length || restoredGiftBatches.length) return;
      if (!force && !checkpointDirty && (!jarConfig.enabled || giftBodies.every(body => body.isSleeping))) return;
      const positions = [];
      for (const body of giftBodies.slice(-1800)) {
        if (airborneGifts.has(body)) continue;
        const x = body.position.x / width;
        const y = body.position.y / height;
        if (x < 0 || x > 1 || y < 0 || y > 1) continue;
        positions.push([body.giftData.key, Math.round(x * 10000) / 10000, Math.round(y * 10000) / 10000,
          Math.round(body.angle * 100) / 100, body.giftData.retainedAfterBreak === true]);
      }
      socket.emit('jar_checkpoint', { sessionId: jarSessionId, sequence: jarEventSequence, positions });
      checkpointDirty = false;
    }

    async function fetchAndApplyInitialConfig() {
      const revision = configRevision;
      try {
        const res = await fetch('/api/jar/config', { cache: 'no-store' });
        const data = await res.json();
        if (data.success && revision === configRevision) applyJarConfig(data.config);
      } catch (_) {}
    }

    function publishJarState() {
      if (!previewMode) {
        if (socket.connected && configReady && inventoryDirty) {
          socket.emit('jar_report_inventory', [...giftInventory.values()]);
          inventoryDirty = false;
        }
        return;
      }
      if (window.parent === window) return;
      window.parent.postMessage({
        type: 'jar-preview-state', ready: configReady, connected: socket.connected,
        enabled: jarConfig.enabled, count: giftBodies.length, coins: jarState.currentCoins,
        condition: assembly ? 'assembling' : jarState.isBurst ? 'broken' : 'ready',
        shardCount: assembly ? assembly.pieces.length : glassShards.length,
        inventory: inventoryDirty ? [...giftInventory.values()] : undefined
      }, location.origin);
      inventoryDirty = false;
    }

    socket.on('connect', async () => {
      inventoryDirty = true;
      jarSyncPending = true;
      const connection = socket.id;
      await fetchAndApplyInitialConfig();
      if (socket.connected && socket.id === connection) {
        socket.emit('jar_sync_session', previewMode ? 'preview' : 'obs', restoreJarSession);
      }
    });
    socket.on('disconnect', () => {
      jarSyncPending = true;
      publishJarState();
    });
    socket.on('jar_drop_gift', data => { if (acceptJarSessionEvent(data)) dropGift(data); });
    socket.on('jar_action', data => { if (acceptJarSessionEvent(data)) triggerAction(data); });
    socket.on('jar_config_updated', (config) => {
      configRevision++;
      applyJarConfig(config);
    });
    fetchAndApplyInitialConfig();
    setInterval(publishJarState, 150);
    setInterval(saveJarCheckpoint, 1500);
    window.addEventListener('pagehide', () => saveJarCheckpoint(true));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) saveJarCheckpoint(true);
    });

    // Kích hoạt âm thanh khi người dùng click vào trang
    window.addEventListener('click', () => AudioEngine.ensureCtx());
  </script>
</body>
</html>
